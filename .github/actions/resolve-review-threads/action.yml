name: Resolve Review Threads
description: Resolves the review threads an earlier automated review left behind

# A building block for the workflows in this repository, not something a repository calls directly.
#
# A review runs again on every push, and the findings of the run before it stay on the pull request
# as open threads. GitHub re-anchors a thread onto the new head commit rather than retiring it, so a
# finding that the author has already fixed still reads as outstanding, against code that no longer
# exists. Its own `isOutdated` flag does not help: a thread whose diff hunk is plainly pre-rebase
# reports `isOutdated: false`, because the re-anchor is what GitHub considers current.
#
# So the run retires its own earlier threads, and the reviewer restates every finding that is still
# outstanding. Each review is then a complete picture of the head commit rather than a difference
# laid over threads that may no longer be true.
#
# A thread is retired only when every comment on it is the reviewer's own and every one of them
# predates this run. A thread somebody replied to is a live conversation, and the reviewer is told
# not to raise a finding again while its thread is still open, so resolving it would end the
# exchange and drop the finding at the same time.

inputs:
  before:
    description: >
      Threads are retired only when every comment on them was written before this instant, as
      `YYYY-MM-DDTHH:MM:SSZ`. Stamp it before the review starts, so a comment the review itself
      wrote is never mistaken for one an earlier run left.
    required: true
  app-id:
    description: 'App ID of the GitHub App that mints the token this action uses'
    required: true
  private-key:
    description: 'Private key of the GitHub App that mints the token this action uses'
    required: true
  pr-number:
    description: 'Pull request to read. Leave empty to use the one the event carries.'
    required: false
    default: ''

outputs:
  resolved:
    description: 'How many threads were resolved'
    value: ${{ steps.resolve.outputs.resolved }}

runs:
  using: composite

  steps:
    - name: Generate a token
      id: generate-token
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}

    - name: Resolve the threads of earlier runs
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.event.repository.name }}
        PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
        APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}
        BEFORE: ${{ inputs.before }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/../../ci/scripts/resolve-review-threads.sh"'
