name: Post Review Verdict
description: Submits one pull request review that carries the verdict of a Claude review

# A building block for the workflows in this repository, not something a repository calls directly.
#
# `anthropics/claude-code-action` writes its findings with `pulls.createReviewComment`, which posts
# loose review comments. GitHub gathers loose comments into a review of its own, and that review is
# always `COMMENTED` with an empty body. So a review that found a blocking defect and a review that
# found nothing arrive in the same state, and the only thing that tells them apart is the prose of a
# separate issue comment. This action gives the run a review of its own, with a state that says what
# the reviewer concluded.
#
# The review is a second review on the pull request, beside the one GitHub synthesized. That is the
# point: a review carries a state, and a state is what a person reads in the sidebar and what
# `gh api .../reviews` reads back.

inputs:
  verdict:
    description: >
      What the reviewer concluded: `approved`, `changes_requested`, `commented`, or `errored` when
      the review did not finish. Any other value is treated as no verdict, and is reported as such
      rather than guessed at.
    required: true
  summary:
    description: 'The verdict in prose, which becomes the body of the review'
    required: false
    default: ''
  blocking-findings:
    description: 'How many findings must be fixed before merge. Omitted unless it is a number.'
    required: false
    default: ''
  advisory-findings:
    description: 'How many findings the author may take or leave. Omitted unless it is a number.'
    required: false
    default: ''
  request-changes:
    description: >
      Whether a `changes_requested` verdict is submitted as `REQUEST_CHANGES` rather than `COMMENT`.

      Warning: `REQUEST_CHANGES` blocks the merge. The `Require Pull Request` ruleset, defined in
      `infra-github`, blocks a merge on a review that requests changes even though
      `required_approving_review_count` is `0` — the count governs approvals, not blocks. Only a
      bypass actor merges past it. Leave this off unless a wrong finding blocking a merge until
      somebody dismisses the review is the behavior that is wanted.
    required: false
    default: 'false'
  app-id:
    description: 'App ID of the GitHub App that mints the token this action uses'
    required: true
  private-key:
    description: 'Private key of the GitHub App that mints the token this action uses'
    required: true
  pr-number:
    description: 'Pull request to review. Leave empty to use the one the event carries.'
    required: false
    default: ''

outputs:
  event:
    description: 'The review event that was submitted: `APPROVE`, `REQUEST_CHANGES`, or `COMMENT`'
    value: ${{ steps.submit.outputs.event }}
  verdict:
    description: 'The verdict as it was recorded, which is `unknown` when the input named no verdict'
    value: ${{ steps.submit.outputs.verdict }}

runs:
  using: composite

  steps:
    - name: Generate a token
      id: generate-token
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}

    - name: Submit the verdict as a review
      id: submit
      shell: bash
      env:
        GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
        APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}
        VERDICT: ${{ inputs.verdict }}
        SUMMARY: ${{ inputs.summary }}
        BLOCKING: ${{ inputs.blocking-findings }}
        ADVISORY: ${{ inputs.advisory-findings }}
        REQUEST_CHANGES: ${{ inputs.request-changes }}
        ACTION_PATH: ${{ github.action_path }}
      run: "$ACTION_PATH/../../ci/scripts/post-review-verdict.sh"
