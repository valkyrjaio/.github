name: Post Comment
description: Keeps one comment per marker on a pull request

# A building block for the workflows in this repository, not something a repository calls directly.
# Twelve workflows held their own copy of this logic, so a correction to it needed twelve identical
# edits, and any one of them could be missed without a failure to show it.
#
# Post and remove are not two modes. The action always removes the comment that carries the marker,
# and it then posts a new one only when it is given a body. An empty body therefore means "clear
# it", which is what a check does when it starts passing again.

inputs:
  marker:
    description: >
      Identifies the comment this action owns, for example `copyright-header-check`. It is written
      into an HTML comment in the body, which is how a later run finds the comment it wrote before.
      One marker per check.
    required: true
  body:
    description: >
      Markdown to post. Leave it empty to remove the comment and post nothing, which is how a check
      clears its own report once it passes.
    required: false
    default: ''
  app-id:
    description: 'App ID of the GitHub App that mints the token this action uses'
    required: true
  private-key:
    description: 'Private key of the GitHub App that mints the token this action uses'
    required: true
  pr-number:
    description: 'Pull request to comment on. Leave empty to use the one the event carries.'
    required: false
    default: ''

runs:
  using: composite

  steps:
    - name: Generate a token
      id: generate-token
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}

    - name: Keep one comment for the marker
      shell: bash
      env:
        GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
        MARKER: ${{ inputs.marker }}
        BODY: ${{ inputs.body }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/../../ci/scripts/post-marked-comment.sh"'
