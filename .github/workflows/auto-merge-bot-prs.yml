name: Auto Merge Bot Pull Requests

on:
  # Hourly rather than daily. A release no longer depends on this sweep — it
  # merges its own dependency pull request and waits for it. This sweep lands
  # everything else the generators open, and an hour is short enough that a
  # green pull request does not sit open long.
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only — report what would merge without merging any'
        type: boolean
        default: false
      repo:
        description: 'Single repository name to target (leave empty for all repos)'
        type: string
        default: ''

run-name: "Auto merge bot pull requests"

# Two overlapping sweeps would race for the same pull requests and one would
# lose the merge to the other.
concurrency:
  group: auto-merge-bot-prs
  cancel-in-progress: false

jobs:
  auto-merge:
    uses: ./.github/workflows/_auto-merge-bot-prs.yml
    with:
      bot-login: 'app/valkyrja-volundr'
      types: 'Dependency,Workflow'
      # This repository is the source every other repository pins, so a merge
      # here reaches all of them at once. It keeps a human in the loop.
      exclude-repos: '.github'
      dry_run: ${{ inputs.dry_run || false }}
      repo: ${{ inputs.repo || '' }}
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
