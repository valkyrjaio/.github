name: Z Reusable Go Create Release

on:
  workflow_call:
    inputs:
      bump:
        description: 'Version component to bump'
        type: string
        required: true
      dependencies:
        description: >
          JSON array of dependencies to check for outdated versions.
          Each item must have a "name" and "directory".
          Leave empty to skip the outdated dependency check.
          Example: [{"name":"golangci-lint","directory":".github/ci/lint"}]
        type: string
        default: ''
      info-file-path:
        description: 'Relative path to the info file (e.g. template/constant/info.go). Leave empty to skip the info file update.'
        type: string
        default: ''
      info-file-name:
        description: 'Simple file name for display (e.g. Info). Leave empty to skip the info file update.'
        type: string
        default: ''

jobs:
  check-version:
    uses: ./.github/workflows/_get-version-for-release.yml
    secrets: inherit
    with:
      bump: ${{ inputs.bump }}

  check-outdated-dependencies:
    needs: check-version
    if: inputs.dependencies != ''
    uses: ./.github/workflows/_go-check-outdated-dependencies.yml
    secrets: inherit
    with:
      dependencies: ${{ inputs.dependencies }}

  update-version-files:
    needs: [check-outdated-dependencies, check-version]
    if: ${{ always() && needs.check-version.result == 'success' && needs.check-outdated-dependencies.result != 'failure' && needs.check-outdated-dependencies.result != 'cancelled' }}
    uses: ./.github/workflows/_update-version-files.yml
    secrets: inherit
    with:
      version: ${{ needs.check-version.outputs.version }}

  update-go-info-files:
    needs: [update-version-files, check-version]
    if: ${{ always() && needs.update-version-files.result == 'success' && inputs.info-file-path != '' }}
    uses: ./.github/workflows/_go-update-info-files.yml
    secrets: inherit
    with:
      version: ${{ needs.check-version.outputs.version }}
      build-date: ${{ needs.check-version.outputs.build-date }}
      info-file-path: ${{ inputs.info-file-path }}
      info-file-name: ${{ inputs.info-file-name }}

  release:
    needs: [update-version-files, update-go-info-files, check-version]
    if: ${{ always() && needs.check-version.result == 'success' && needs.update-version-files.result == 'success' && needs.update-go-info-files.result != 'failure' && needs.update-go-info-files.result != 'cancelled' }}
    uses: ./.github/workflows/_release.yml
    secrets: inherit
    with:
      version: ${{ needs.check-version.outputs.version }}
