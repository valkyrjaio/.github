name: Z Reusable Go Create Release

on:
  workflow_call:
    inputs:
      bump:
        description: 'Version component to bump (auto, patch, feature, yearly, or rc)'
        type: string
        required: true
      dependencies:
        description: >
          JSON array of dependencies to check for outdated versions.
          Each item must have a "name" and "directory".
          Leave empty to skip the outdated dependency check.
          Example: [{"name":"golangci-lint","directory":".github/ci/lint"}]
        type: string
        default: ''
      info-file-path:
        description: 'Relative path to the info file (e.g. template/constant/info.go). Leave empty to skip the info file update.'
        type: string
        default: ''
      info-file-name:
        description: 'Simple file name for display (e.g. Info). Leave empty to skip the info file update.'
        type: string
        default: ''
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  check-version:
    uses: ./.github/workflows/_get-version-for-release.yml
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
    with:
      bump: ${{ inputs.bump }}

  check-outdated-dependencies:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true' && inputs.dependencies != ''
    uses: ./.github/workflows/_go-check-outdated-dependencies.yml
    with:
      dependencies: ${{ inputs.dependencies }}

  update-version-files:
    needs: [check-outdated-dependencies, check-version]
    if: ${{ needs.check-version.outputs.should-release == 'true' && always() && needs.check-version.result == 'success' && needs.check-outdated-dependencies.result != 'failure' && needs.check-outdated-dependencies.result != 'cancelled' }}
    uses: ./.github/workflows/_update-version-files.yml
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
    with:
      version: ${{ needs.check-version.outputs.version }}

  update-go-info-files:
    needs: [update-version-files, check-version]
    if: ${{ needs.check-version.outputs.should-release == 'true' && always() && needs.update-version-files.result == 'success' && inputs.info-file-path != '' }}
    uses: ./.github/workflows/_go-update-info-files.yml
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
    with:
      version: ${{ needs.check-version.outputs.version }}
      build-date: ${{ needs.check-version.outputs.build-date }}
      info-file-path: ${{ inputs.info-file-path }}
      info-file-name: ${{ inputs.info-file-name }}

  release:
    needs: [update-version-files, update-go-info-files, check-version]
    if: ${{ needs.check-version.outputs.should-release == 'true' && always() && needs.check-version.result == 'success' && needs.update-version-files.result == 'success' && needs.update-go-info-files.result != 'failure' && needs.update-go-info-files.result != 'cancelled' }}
    uses: ./.github/workflows/_release.yml
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
    with:
      version: ${{ needs.check-version.outputs.version }}
