name: Z Reusable PHP Update Dependencies Across Repos

on:
  workflow_call:
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  update-dependencies:
    name: Update PHP Dependencies Across Repos

    runs-on: ubuntu-latest

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Trigger update-dependencies across all PHP repositories
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          SUPPORTED_VERSIONS: ${{ vars.SUPPORTED_VERSIONS }}
        run: |
          REPOS=$(gh repo list "$ORG" --limit 200 --json name,isArchived \
            --jq '.[] | select(.isArchived == false and (.name | endswith("-php"))) | .name')

          while IFS= read -r REPO_NAME; do
            echo "Checking $ORG/$REPO_NAME..."

            WORKFLOW_EXISTS=$(gh api "repos/$ORG/$REPO_NAME/contents/.github/workflows/update-dependencies.yml" \
              --jq '.name' 2>/dev/null || true)

            if [ -z "$WORKFLOW_EXISTS" ]; then
              echo "  No update-dependencies.yml found, skipping."
              continue
            fi

            ALL_BRANCHES=$(gh api "repos/$ORG/$REPO_NAME/branches" --paginate \
              --jq '.[].name' 2>/dev/null || true)

            BASE_BRANCHES=""
            while IFS= read -r b; do
              if [[ "$b" =~ ^([0-9]+)\.x$ ]]; then
                MAJOR="${BASH_REMATCH[1]}"
                if [ -n "$SUPPORTED_VERSIONS" ] && [[ "$MAJOR" =~ $SUPPORTED_VERSIONS ]]; then
                  BASE_BRANCHES="$BASE_BRANCHES"$'\n'"$b"
                fi
              fi
            done <<< "$ALL_BRANCHES"

            if [ -z "$BASE_BRANCHES" ]; then
              BASE_BRANCHES="master"
            fi

            while IFS= read -r BRANCH; do
              [ -z "$BRANCH" ] && continue
              echo "  Triggering update-dependencies.yml on $BRANCH..."
              TRIGGER_ERR=$(gh workflow run update-dependencies.yml \
                --repo "$ORG/$REPO_NAME" \
                --ref "$BRANCH" 2>&1 >/dev/null || true)
              if [ -n "$TRIGGER_ERR" ]; then
                echo "  Failed to trigger on $BRANCH: $TRIGGER_ERR"
              else
                echo "  Triggered on $BRANCH."
              fi
            done <<< "$BASE_BRANCHES"
          done <<< "$REPOS"
