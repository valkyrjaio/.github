name: Z Reusable Python Update pyproject.toml

on:
  workflow_call:
    inputs:
      version:
        description: 'The version without v prefix (e.g. 26.1.0)'
        type: string
        required: true
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  update-pyproject:
    name: "Update pyproject.toml for v${{ inputs.version }}"

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Get bot user ID
        id: get-bot-user-id
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}
        run: |
          BOT_USER_ID=$(gh api "/users/$APP_SLUG[bot]" --jq '.id')
          echo "user-id=$BOT_USER_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ steps.generate-token.outputs.token }}
          ref: ${{ github.ref_name }}

      - name: Pull latest changes
        run: git pull --rebase origin ${{ github.ref_name }}

      - name: Update pyproject.toml version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i -E "0,/^version = .*/s//version = \"$VERSION\"/" pyproject.toml

      - name: Commit pyproject.toml change
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "[v${{ inputs.version }}] chore: Update pyproject.toml for the release"
          commit_user_name: ${{ steps.generate-token.outputs.app-slug }}[bot]
          commit_user_email: ${{ steps.get-bot-user-id.outputs.user-id }}+${{ steps.generate-token.outputs.app-slug }}[bot]@users.noreply.github.com
          commit_author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
