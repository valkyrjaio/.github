name: Z Reusable Update TypeScript Info Files

on:
  workflow_call:
    inputs:
      version:
        description: 'The version without v prefix (e.g. 26.1.0)'
        type: string
        required: true
      build-date:
        description: 'The build date string (e.g. April 17 2026 12:00:00 MST)'
        type: string
        required: true
      info-file-path:
        description: 'Relative path to the ApplicationInfo.ts file (e.g. src/Valkyrja/Application/Constant/ApplicationInfo.ts)'
        type: string
        required: true
      info-file-name:
        description: 'Simple file name for display (e.g. ApplicationInfo)'
        type: string
        required: true
      node-version:
        description: 'Node.js version to use'
        type: string
        default: '22'

jobs:
  update-info-file:
    name: "Update ${{ inputs.info-file-name }} for v${{ inputs.version }}"

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Get bot user ID
        id: get-bot-user-id
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}
        run: |
          BOT_USER_ID=$(gh api "/users/$APP_SLUG[bot]" --jq '.id')
          echo "user-id=$BOT_USER_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.generate-token.outputs.token }}
          ref: ${{ github.ref_name }}

      - name: Pull latest changes
        run: git pull --rebase origin ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Update ${{ inputs.info-file-name }}.ts
        env:
          VERSION: ${{ inputs.version }}
          BUILD_DATE: ${{ inputs.build-date }}
          INFO_FILE_PATH: ${{ inputs.info-file-path }}
        run: |
          sed -i "s/static readonly VERSION = '.*'/static readonly VERSION = '$VERSION'/g" "$INFO_FILE_PATH"
          sed -i "s/static readonly VERSION_BUILD_DATE_TIME = '.*'/static readonly VERSION_BUILD_DATE_TIME = '$BUILD_DATE'/g" "$INFO_FILE_PATH"

      - name: Update package.json version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Commit ${{ inputs.info-file-name }} change
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[Release] Update ${{ inputs.info-file-name }} for v${{ inputs.version }} release"
          commit_user_name: ${{ steps.generate-token.outputs.app-slug }}[bot]
          commit_user_email: ${{ steps.get-bot-user-id.outputs.user-id }}+${{ steps.generate-token.outputs.app-slug }}[bot]@users.noreply.github.com
          commit_author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
