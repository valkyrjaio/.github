name: Z Reusable Markdown Check

# Every Markdown file a repository tracks is formatted by Prettier.
#
# The work is not here. The `run-script` action runs the script and reports what it wrote, and the
# `post-comment` action keeps that report on the pull request. This workflow names the check and
# wires the two together, so a correction to either building block reaches every check at once.
#
# Both actions live in this repository, and an action cannot fetch the files it is itself made of.
# The job therefore checks this repository out at `job.workflow_sha` first, which is the commit the
# caller pinned, and reaches the actions through that checkout.

on:
  workflow_call:
    inputs:
      prettier-version:
        description: 'Prettier version the check runs. Pinned here so one edit upgrades every repository.'
        type: string
        default: '3.9.6'
      node-version:
        description: 'Node.js version Prettier runs on'
        type: string
        default: '22'
      post-pr-comment:
        description: 'Whether to post a PR comment on failure (and delete it on success)'
        type: boolean
        default: true
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  check:
    name: Check Markdown

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Checkout the CI actions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: valkyrjaio/.github
          ref: ${{ job.workflow_sha }}
          path: dot-github

      # The script calls Prettier through `npx`, so Node comes first.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      # `continue-on-error` keeps a failing script from ending the job here, so the report reaches
      # the comment below. The last step decides the result of the job.
      - name: Run the check
        id: check
        continue-on-error: true
        uses: ./dot-github/.github/actions/run-script
        with:
          script: markdown-check.sh
          expected-ref: ${{ job.workflow_sha }}
          env: |
            PRETTIER_VERSION=${{ inputs.prettier-version }}

      # The script writes the report as Markdown, and that report holds a fenced code block, so the
      # body is the raw report rather than the fenced form. A passing check posts no body, which
      # removes the report an earlier run left behind.
      - name: Report the result on the pull request
        if: always() && inputs.post-pr-comment && github.event.pull_request.number
        uses: ./dot-github/.github/actions/post-comment
        with:
          marker: markdown-check
          body: ${{ steps.check.outputs.outcome == 'failure' && steps.check.outputs.report || '' }}
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Fail when the check failed
        if: always()
        env:
          OUTCOME: ${{ steps.check.outputs.outcome }}
        run: |
          if [[ "$OUTCOME" != 'success' ]]; then
            echo 'The check reported a failure. Its output is above, and on the pull request.'
            exit 1
          fi
