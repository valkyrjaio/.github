name: Z Reusable Rebase from Master

on:
  workflow_call:
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  rebase:
    name: "Rebase ${{ github.ref_name }} from master"

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Git user
        run: |
          git config --global user.email "${{ vars.USER_EMAIL }}"
          git config --global user.name "${{ vars.USER_NAME }}"

      - name: Backup ${{ github.ref_name }}
        run: |
          git push --force-with-lease origin ${{ github.ref_name }}:${{ github.ref_name }}-backup

      - name: Rebase ${{ github.ref_name }} from master
        run: |
          git fetch origin master
          git rebase origin/master

      - name: Push ${{ github.ref_name }}
        run: |
          git push --force-with-lease origin ${{ github.ref_name }}
