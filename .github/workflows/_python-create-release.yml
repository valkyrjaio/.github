name: Z Reusable Python Create Release

on:
  workflow_call:
    inputs:
      bump:
        description: 'Version component to bump (auto, patch, feature, yearly, or rc)'
        type: string
        required: true
      python-version:
        description: 'Python version to use'
        type: string
        default: '3.14'
      dependencies:
        description: >
          JSON array of dependencies to check for outdated versions.
          Each item must have a "name" and "directory".
          Example: [{"name":"Ruff","directory":".github/ci/ruff"}]
        type: string
        required: true
      info-file-path:
        description: 'Relative path to the info file (e.g. src/valkyrja/template/constant/template_info.py). Leave empty to skip the info file update.'
        type: string
        default: ''
      info-file-name:
        description: 'Simple file name for display (e.g. TemplateInfo). Leave empty to skip the info file update.'
        type: string
        default: ''

jobs:
  check-version:
    uses: ./.github/workflows/_get-version-for-release.yml
    secrets: inherit
    with:
      bump: ${{ inputs.bump }}

  check-outdated-dependencies:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    uses: ./.github/workflows/_python-check-outdated-dependencies.yml
    secrets: inherit
    with:
      python-version: ${{ inputs.python-version }}
      dependencies: ${{ inputs.dependencies }}

  update-version-files:
    needs: [check-outdated-dependencies, check-version]
    if: needs.check-version.outputs.should-release == 'true'
    uses: ./.github/workflows/_update-version-files.yml
    secrets: inherit
    with:
      version: ${{ needs.check-version.outputs.version }}

  update-python-pyproject:
    needs: [update-version-files, check-version]
    if: needs.check-version.outputs.should-release == 'true'
    uses: ./.github/workflows/_python-update-pyproject.yml
    secrets: inherit
    with:
      version: ${{ needs.check-version.outputs.version }}

  update-python-info-files:
    needs: [update-python-pyproject, check-version]
    if: needs.check-version.outputs.should-release == 'true' && inputs.info-file-path != ''
    uses: ./.github/workflows/_python-update-info-files.yml
    secrets: inherit
    with:
      version: ${{ needs.check-version.outputs.version }}
      build-date: ${{ needs.check-version.outputs.build-date }}
      info-file-path: ${{ inputs.info-file-path }}
      info-file-name: ${{ inputs.info-file-name }}

  release:
    needs: [update-version-files, update-python-pyproject, update-python-info-files, check-version]
    if: ${{ needs.check-version.outputs.should-release == 'true' && always() && needs.check-version.result == 'success' && needs.update-version-files.result == 'success' && needs.update-python-pyproject.result == 'success' && needs.update-python-info-files.result != 'failure' }}
    uses: ./.github/workflows/_release.yml
    secrets: inherit
    with:
      version: ${{ needs.check-version.outputs.version }}
