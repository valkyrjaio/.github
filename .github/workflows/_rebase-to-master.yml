name: Z Reusable Rebase to Master

on:
  workflow_call:

jobs:
  rebase:
    name: "Rebase master onto ${{ github.ref_name }}"

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Git user
        run: |
          git config --global user.email "${{ vars.USER_EMAIL }}"
          git config --global user.name "${{ vars.USER_NAME }}"

      - name: Validate source branch is latest major version
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          LATEST_MAJOR_VERSION: ${{ vars.LATEST_MAJOR_VERSION }}
        run: |
          SOURCE_MAJOR="${SOURCE_BRANCH%%.*}"

          if [ -z "$LATEST_MAJOR_VERSION" ]; then
            YEAR=$(date +%Y)
            LATEST_MAJOR_VERSION="${YEAR:2}"
            echo "LATEST_MAJOR_VERSION not set, falling back to current year: $LATEST_MAJOR_VERSION"
          fi

          echo "Source branch major version: $SOURCE_MAJOR"
          echo "Latest major version: $LATEST_MAJOR_VERSION"

          if [ "$SOURCE_MAJOR" != "$LATEST_MAJOR_VERSION" ]; then
            echo "Only the latest major version branch (${LATEST_MAJOR_VERSION}.x) may be rebased into master."
            echo "To backport between version branches use the rebase-version-branch workflow."

            exit 1
          fi

          echo "Source branch is the latest major version branch. Proceeding."

      - name: Backup master
        run: |
          git checkout master
          git push --force-with-lease origin master:master-backup

      - name: Rebase master onto ${{ github.ref_name }}
        run: |
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"

      - name: Push master
        run: |
          git push --force-with-lease origin master
