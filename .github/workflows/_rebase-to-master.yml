name: Z Reusable Rebase to Master

on:
  workflow_call:
    inputs:
      allow_diverged:
        description: >
          Rebase even when master holds commits of its own. The force push then rewrites
          those commits, so set this only for a deliberate, attended run.
        type: boolean
        default: false
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  rebase:
    name: "Rebase master onto ${{ github.ref_name }}"

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Git user
        run: |
          git config --global user.email "${{ vars.USER_EMAIL }}"
          git config --global user.name "${{ vars.USER_NAME }}"

      - name: Validate source branch is latest major version
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          LATEST_MAJOR_VERSION: ${{ vars.LATEST_MAJOR_VERSION }}
        run: |
          SOURCE_MAJOR="${SOURCE_BRANCH%%.*}"

          if [ -z "$LATEST_MAJOR_VERSION" ]; then
            YEAR=$(date +%Y)
            LATEST_MAJOR_VERSION="${YEAR:2}"
            echo "LATEST_MAJOR_VERSION not set, falling back to current year: $LATEST_MAJOR_VERSION"
          fi

          echo "Source branch major version: $SOURCE_MAJOR"
          echo "Latest major version: $LATEST_MAJOR_VERSION"

          if [ "$SOURCE_MAJOR" != "$LATEST_MAJOR_VERSION" ]; then
            echo "Only the latest major version branch (${LATEST_MAJOR_VERSION}.x) may be rebased into master."
            echo "To backport between version branches use the rebase-version-branch workflow."

            exit 1
          fi

          echo "Source branch is the latest major version branch. Proceeding."

      - name: Validate master holds no commits of its own
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          ALLOW_DIVERGED: ${{ inputs.allow_diverged }}
        run: |
          AHEAD=$(git rev-list --count "origin/${SOURCE_BRANCH}..origin/master")

          echo "master holds $AHEAD commit(s) that $SOURCE_BRANCH does not."

          if [ "$AHEAD" -ne 0 ] && [ "$ALLOW_DIVERGED" != "true" ]; then
            echo "Refusing to rebase. The force push rewrites those $AHEAD commit(s), which exist only on master."
            echo "Every open pull request based on master then points at commits that no longer exist."
            echo "Run this workflow again with allow_diverged set to rebase them deliberately."

            exit 1
          fi

          if [ "$AHEAD" -eq 0 ]; then
            echo "The rebase replays nothing onto master, so it cannot rewrite history. Proceeding."
          else
            echo "allow_diverged is set, so the rebase rewrites those $AHEAD commit(s). Proceeding."
          fi

      - name: Backup master
        run: |
          git checkout master
          git push --force-with-lease origin master:master-backup

      - name: Rebase master onto ${{ github.ref_name }}
        run: |
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"

      - name: Push master
        run: |
          git push --force-with-lease origin master
