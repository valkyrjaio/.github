name: Z Reusable PHP Update Dependencies

on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version to use'
        type: string
        default: '8.4'
      dependencies:
        description: >
          JSON array of dependencies to update.
          Each item must have a "name" (display name), "command" (composer script to run),
          and "directory" (path to the composer.json to sync, e.g. ".github/ci/psalm").
          Example: [{"name":"Psalm","command":"psalm-composer-update","directory":".github/ci/psalm"}]
        type: string
        required: true
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  update-php-dependencies:
    name: Update PHP Dependencies

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Get bot user ID
        id: get-bot-user-id
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}
        run: |
          BOT_USER_ID=$(gh api "/users/$APP_SLUG[bot]" --jq '.id')
          echo "user-id=$BOT_USER_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Checkout existing PR branch if present
        id: prep-branch
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BASE: ${{ github.ref_name }}
        run: |
          EXISTING=$(gh pr list \
            --base "$BASE" \
            --state open \
            --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("deps/update-dependencies-"))] | first | .headRefName // ""')

          if [ -n "$EXISTING" ]; then
            echo "Found existing PR branch: $EXISTING"
            git fetch origin "$EXISTING"
            git checkout "$EXISTING"
            echo "branch=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "is-new=false" >> "$GITHUB_OUTPUT"
          else
            BRANCH="deps/update-dependencies-$(date +%Y-%m-%d)"
            echo "No existing PR branch. Will create: $BRANCH"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "is-new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, intl

      - name: Update dependencies and sync composer.json constraints
        env:
          DEPENDENCIES: ${{ inputs.dependencies }}
        run: |
          # Escape a string for literal use in a POSIX BRE. Only . [ * ^ $ \ are
          # metacharacters there — escaping | + ? ( ) { } turns them into GNU sed
          # operators instead (\| is alternation, which matches the empty string
          # and rewrites the wrong span), so they are deliberately left alone.
          escape_bre() {
            printf '%s' "$1" | sed 's/[.[*^$\\]/\\&/g'
          }

          # Rewrite "$2" to "$3" on package "$1"'s line in $COMPOSER_FILE, then
          # confirm the file is still valid JSON so a bad rewrite fails loudly
          # here rather than as a cryptic jq parse error later in the loop.
          replace_on_package_line() {
            sed -i "\|\"$(escape_bre "$1")\"|s/\"$(escape_bre "$2")\"/\"$3\"/" "$COMPOSER_FILE"

            if ! jq empty "$COMPOSER_FILE" 2>/dev/null; then
              echo "::error::Rewriting $1 ($2 -> $3) produced invalid JSON in $COMPOSER_FILE"
              exit 1
            fi
          }

          > /tmp/dependency_changes.txt

          LENGTH=$(echo "$DEPENDENCIES" | jq 'length')
          for i in $(seq 0 $((LENGTH - 1))); do
            NAME=$(echo "$DEPENDENCIES" | jq -r ".[$i].name")
            CMD=$(echo "$DEPENDENCIES" | jq -r ".[$i].command")
            DIR=$(echo "$DEPENDENCIES" | jq -r ".[$i].directory // \".\"")

            LOCK_FILE="$DIR/composer.lock"
            BEFORE=""
            if [ -f "$LOCK_FILE" ]; then
              BEFORE=$(jq -r '(.packages + (.["packages-dev"] // []))[] | "\(.name) \(.version)"' "$LOCK_FILE" 2>/dev/null || echo "")
            fi

            echo "Updating $NAME..."
            composer $CMD

            echo "Syncing $NAME composer.json version constraints..."
            INSTALLED=""
            if [ -f "$LOCK_FILE" ]; then
              INSTALLED=$(jq -r '(.packages + (.["packages-dev"] // []))[] | "\(.name) \(.version)"' "$LOCK_FILE" 2>/dev/null || echo "")
            fi

            while IFS= read -r line; do
              [ -z "$line" ] && continue
              PKG=$(echo "$line" | awk '{print $1}')
              VER=$(echo "$line" | awk '{print $2}' | sed 's/^v//')

              [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || continue

              COMPOSER_FILE="$DIR/composer.json"
              PKG_ESC=$(escape_bre "$PKG")

              # require / require-dev: "^OLD" → "^NEW"
              for SECTION in require require-dev; do
                OLD=$(jq -r --arg p "$PKG" --arg s "$SECTION" '.[$s][$p] // ""' "$COMPOSER_FILE")
                [ -z "$OLD" ] && continue
                # A composite constraint ("^3.5 || ^4.0") deliberately spans
                # majors — collapsing it to the installed version would silently
                # drop support, so leave it for a human to widen or narrow.
                case "$OLD" in
                  *'|'*)
                    echo "  [$SECTION] $PKG: left composite constraint $OLD unchanged"
                    continue
                    ;;
                esac
                NEW="^$VER"
                [ "$OLD" = "$NEW" ] && continue
                replace_on_package_line "$PKG" "$OLD" "$NEW"
                echo "  [$SECTION] $PKG: $OLD -> $NEW"
              done

              # conflict: "<OLD" → "<NEW"
              OLD_CONFLICT=$(jq -r --arg p "$PKG" '.conflict[$p] // ""' "$COMPOSER_FILE")
              if [ -n "$OLD_CONFLICT" ]; then
                NEW_CONFLICT="<$VER"
                if [ "$OLD_CONFLICT" != "$NEW_CONFLICT" ]; then
                  replace_on_package_line "$PKG" "$OLD_CONFLICT" "$NEW_CONFLICT"
                  echo "  [conflict] $PKG: $OLD_CONFLICT -> $NEW_CONFLICT"
                fi
              fi

              # suggest: update version number(s) embedded in description string
              HAS_SUGGEST=$(jq -r --arg p "$PKG" 'if .suggest and (.suggest | has($p)) then "true" else "false" end' "$COMPOSER_FILE")
              if [ "$HAS_SUGGEST" = "true" ]; then
                sed -i -E "\|\"$PKG_ESC\"| s/[0-9]+\.[0-9]+\.[0-9]+[0-9.]*/$VER/g" "$COMPOSER_FILE"
                echo "  [suggest] $PKG: updated version in description"
              fi
              # Track version change for PR body
              OLD_VER=$(echo "$BEFORE" | grep "^$PKG " | awk '{print $2}' | sed 's/^v//')
              if [ -n "$OLD_VER" ] && [ "$OLD_VER" != "$VER" ]; then
                echo "$PKG|v$OLD_VER|v$VER" >> /tmp/dependency_changes.txt
              fi
            done <<< "$INSTALLED"
          done

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "No dependency updates found."
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Dependency updates found."
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.check-changes.outputs.has-changes == 'true'
        env:
          APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}
          BOT_USER_ID: ${{ steps.get-bot-user-id.outputs.user-id }}
        run: |
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$BOT_USER_ID+$APP_SLUG[bot]@users.noreply.github.com"

      - name: Commit and push PR branch
        if: steps.check-changes.outputs.has-changes == 'true'
        id: branch
        env:
          BRANCH: ${{ steps.prep-branch.outputs.branch }}
          IS_NEW: ${{ steps.prep-branch.outputs.is-new }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          if [ "$IS_NEW" = "true" ]; then
            git checkout -b "$BRANCH"
          fi
          git add -A
          git commit \
            --author="$ACTOR <$ACTOR_ID+$ACTOR@users.noreply.github.com>" \
            -m "[Dependency] build: Update composer dependencies."
          git push --force-with-lease origin "$BRANCH"

      - name: Create pull request
        if: steps.check-changes.outputs.has-changes == 'true' && steps.prep-branch.outputs.is-new == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BASE: ${{ github.ref_name }}
          BRANCH: ${{ steps.prep-branch.outputs.branch }}
          DEPENDENCIES: ${{ inputs.dependencies }}
          REVIEWER: ${{ vars.VALKYRJA_REVIEWER }}
        run: |
          BODY=""
          BODY+="# Description"$'\n'$'\n'
          BODY+="Automated composer dependency updates."$'\n'$'\n'
          BODY+="## Types of changes"$'\n'$'\n'
          BODY+="- [X] Improvement _(non-breaking change which improves code)_"$'\n'
          BODY+="- [ ] Bug fix _(non-breaking change which fixes an issue)_"$'\n'
          BODY+="- [ ] New feature _(non-breaking change which adds functionality)_"$'\n'
          BODY+="- [ ] Deprecation _(breaking change which removes functionality)_"$'\n'
          BODY+="- [ ] Breaking change _(fix or feature that would cause existing functionality to change)_"$'\n'
          BODY+="- [ ] Documentation improvement"$'\n'$'\n'
          BODY+="## Changes"$'\n'$'\n'

          if [ -s /tmp/dependency_changes.txt ]; then
            BODY+="| Package | From | To |"$'\n'
            BODY+="|---------|------|----|"$'\n'
            while IFS='|' read -r pkg from to; do
              BODY+="| \`$pkg\` | $from | $to |"$'\n'
            done < /tmp/dependency_changes.txt
          else
            BODY+="_No explicit version changes detected — lock file or constraint updates only._"$'\n'
          fi

          REVIEWER_FLAGS=""
          if [ -n "$REVIEWER" ]; then
            REVIEWER_FLAGS="--assignee $REVIEWER --reviewer $REVIEWER"
          fi

          gh pr create \
            --title "[Dependency] build: Update composer dependencies" \
            --body "$BODY" \
            --base "$BASE" \
            --head "$BRANCH" \
            $REVIEWER_FLAGS
