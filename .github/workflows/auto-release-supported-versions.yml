name: Auto Release Supported Versions

on:
  schedule:
    # One cron per slot in the table below — the script fails a run whose cron
    # the table does not name, so the two lists cannot drift apart silently.
    # Times are UTC. The org's clock is America/Phoenix (UTC-7, no DST), so
    # each cron maps to the same local hour all year.
    #
    # Every slot releases. A release refreshes its own dependencies as its
    # first step, so no slot exists to refresh them beforehand and no slot
    # waits for one to land. The gap between slots therefore covers one thing:
    # a cohort releases after the cohorts it depends on, and each registry
    # needs time to serve what shipped. An hour covers that. Infra goes first,
    # because a `.github` release pushes a workflow-ref re-pin into every later
    # cohort's release.
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot to run'
        type: choice
        required: true
        options:
          - infra-release
          - ci-release
          - framework-release
          - sindri-release
          - project-release
      dry_run:
        description: 'Preview only — list dispatches without triggering any'
        type: boolean
        default: false
      repo:
        description: 'Single repository name to target (leave empty for all repos)'
        type: string
        default: ''

run-name: "Auto release slot: ${{ inputs.slot || github.event.schedule }}"

# One slot at a time. Two overlapping slots could dispatch a dependent while
# its dependency is mid-release.
concurrency:
  group: auto-release-supported-versions
  cancel-in-progress: false

jobs:
  auto-release:
    uses: ./.github/workflows/_auto-release-supported-versions.yml
    with:
      # The master plan: name | cron (UTC) | action | cohorts. Cohort
      # membership is derived from the repository name per
      # REPOSITORY_NAMING.md — see `cohort_of` in the script. A repository no
      # cohort claims runs in `catchall` and is flagged in the run summary.
      slots: |
        infra-release     | 0 7 * * *  | release | infra
        ci-release        | 0 8 * * *  | release | ci
        framework-release | 0 9 * * *  | release | frameworks
        sindri-release    | 0 10 * * * | release | sindri
        project-release   | 0 11 * * * | release | projects catchall
      # A release run now carries the dependency refresh, its pull request's checks, and the
      # merge, on top of the publish and the wait for the registry to serve it. The longest
      # today is a Java release at a little over half an hour, and the refresh adds at most 30
      # (`_update-dependencies-for-release.yml` allows 12 plus 18).
      #
      # Warning: this has to leave the slot finishing inside the hour before the next one. The
      # sweep waits on every dispatch it makes, slots share one concurrency group with
      # `cancel-in-progress: false`, and GitHub holds only one run pending per group — so a slot
      # that overran into a third would have its successor cancelled outright, dropping a
      # cohort's release for the day rather than delaying it. 45 keeps the whole slot clear of
      # that, and a watch that gives up does not fail the slot: the run it stopped watching
      # carries on and still publishes.
      stage-timeout-minutes: 45
      slot: ${{ inputs.slot || '' }}
      schedule: ${{ github.event.schedule || '' }}
      dry_run: ${{ inputs.dry_run || false }}
      repo: ${{ inputs.repo || '' }}
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
