name: Auto Release Supported Versions

on:
  schedule:
    # One cron per slot in the table below — the script fails a run whose cron
    # the table does not name, so the two lists cannot drift apart silently.
    # Times are UTC. The org's clock is America/Phoenix (UTC-7, no DST), so
    # each cron maps to the same local hour all year.
    #
    # A cohort's dependencies refresh two hours before its release, so the
    # hourly auto-merge sweep gets two passes at the bump pull requests. A
    # cohort releases after the cohorts it depends on, with a gap for each
    # registry to serve what shipped. Infra goes first so the workflow-ref
    # re-pins a `.github` release pushes are in every later cohort's release.
    - cron: '0 5 * * *'
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot to run'
        type: choice
        required: true
        options:
          - infra-deps
          - infra-release
          - ci-deps
          - ci-release
          - framework-deps
          - framework-release
          - sindri-deps
          - sindri-release
          - project-deps
          - project-release
      dry_run:
        description: 'Preview only — list dispatches without triggering any'
        type: boolean
        default: false
      repo:
        description: 'Single repository name to target (leave empty for all repos)'
        type: string
        default: ''

run-name: "Auto release slot: ${{ inputs.slot || github.event.schedule }}"

# One slot at a time. Two overlapping slots could dispatch a dependent while
# its dependency is mid-release.
concurrency:
  group: auto-release-supported-versions
  cancel-in-progress: false

jobs:
  auto-release:
    uses: ./.github/workflows/_auto-release-supported-versions.yml
    with:
      # The master plan: name | cron (UTC) | action | cohorts. Cohort
      # membership is derived from the repository name per
      # REPOSITORY_NAMING.md — see `cohort_of` in the script. A repository no
      # cohort claims runs in `catchall` and is flagged in the run summary.
      slots: |
        infra-deps        | 0 5 * * *  | deps    | infra
        infra-release     | 0 7 * * *  | release | infra
        ci-deps           | 0 8 * * *  | deps    | ci
        ci-release        | 0 10 * * * | release | ci
        framework-deps    | 0 11 * * * | deps    | frameworks
        framework-release | 0 13 * * * | release | frameworks
        sindri-deps       | 0 14 * * * | deps    | sindri
        sindri-release    | 0 16 * * * | release | sindri
        project-deps      | 0 17 * * * | deps    | projects catchall
        project-release   | 0 19 * * * | release | projects catchall
      slot: ${{ inputs.slot || '' }}
      schedule: ${{ github.event.schedule || '' }}
      dry_run: ${{ inputs.dry_run || false }}
      repo: ${{ inputs.repo || '' }}
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
