name: Auto Release Supported Versions

on:
  schedule:
    # One cron per slot in the table below — the script fails a run whose cron
    # the table does not name, so the two lists cannot drift apart silently.
    # Times are UTC. The org's clock is America/Phoenix (UTC-7, no DST), so
    # each cron maps to the same local hour all year.
    #
    # Every slot releases. A release refreshes its own dependencies as its
    # first step, so no slot exists to refresh them beforehand and no slot
    # waits for one to land. The gap between slots therefore covers one thing:
    # a cohort releases after the cohorts it depends on, and each registry
    # needs time to serve what shipped. An hour covers that. Infra goes first,
    # because a `.github` release pushes a workflow-ref re-pin into every later
    # cohort's release.
    #
    # Warning: no slot sits on 09:00. Every repository's own `update-dependencies`
    # cron fires then, and a release dispatches that same workflow and waits for it
    # on a short budget — two runs of it on one branch queue against each other, and
    # the release is the one holding a deadline. The first slot is an hour later, and
    # the cohort that consumes dependencies is three.
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot to run'
        type: choice
        required: true
        options:
          - infra-release
          - ci-release
          - framework-release
          - sindri-release
          - project-release
      dry_run:
        description: 'Preview only — list dispatches without triggering any'
        type: boolean
        default: false
      repo:
        description: 'Single repository name to target (leave empty for all repos)'
        type: string
        default: ''

run-name: "Auto release slot: ${{ inputs.slot || github.event.schedule }}"

# One slot at a time. Two overlapping slots could dispatch a dependent while
# its dependency is mid-release.
concurrency:
  group: auto-release-supported-versions
  cancel-in-progress: false

jobs:
  auto-release:
    uses: ./.github/workflows/_auto-release-supported-versions.yml
    with:
      # The master plan: name | cron (UTC) | action | cohorts. Cohort
      # membership is derived from the repository name per
      # REPOSITORY_NAMING.md — see `cohort_of` in the script. A repository no
      # cohort claims runs in `catchall` and is flagged in the run summary.
      slots: |
        infra-release     | 0 10 * * * | release | infra
        ci-release        | 0 11 * * * | release | ci
        framework-release | 0 12 * * * | release | frameworks
        sindri-release    | 0 13 * * * | release | sindri
        project-release   | 0 14 * * * | release | projects catchall
      # A release run now carries the dependency refresh, its pull request's checks, and the
      # merge, on top of the publish and the wait for the registry to serve it. Measured, that
      # is about eight minutes of refresh in front of a release that has reached 33 — so 45
      # leaves room for the work these runs actually do.
      #
      # It does not cover a run that reaches every ceiling at once: 12 plus 18 for the refresh
      # in front of a 33-minute release exceeds it. That is the intent. Those ceilings bound a
      # run that has gone wrong rather than describe one that has not, and a slot that spends
      # its budget reports `unwatched` and goes red — which is the outcome worth having for a
      # run nobody read.
      #
      # Warning: this has to leave the slot finishing inside the hour before the next one. Slots
      # share one concurrency group with `cancel-in-progress: false`, and GitHub holds only one
      # run pending per group — so a slot that overran into a third would have its successor
      # cancelled outright, dropping a cohort's release for the day rather than delaying it.
      #
      # The script spends this budget across the whole wait phase rather than per dispatch, so
      # the slot cannot exceed it however many runs overrun at once. A wait that reaches its own
      # deadline does not fail the slot — the run it stopped watching carries on and still
      # publishes. A budget spent before a run is looked at does fail it, because nobody read
      # that outcome.
      stage-timeout-minutes: 45
      slot: ${{ inputs.slot || '' }}
      schedule: ${{ github.event.schedule || '' }}
      dry_run: ${{ inputs.dry_run || false }}
      repo: ${{ inputs.repo || '' }}
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
