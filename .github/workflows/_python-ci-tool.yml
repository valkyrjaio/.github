name: Z Reusable Python CI Tool

on:
  workflow_call:
    inputs:
      tool:
        description: >
          Which CI tool to run: bandit, import-linter, mypy, or ruff. Selects the
          job's defaults — the CI directory, the poe tasks to run, and the
          remediation text in the PR comment.
        type: string
        required: true
      python-version:
        description: 'Python version to use'
        type: string
        default: '3.14'
      ci-directory:
        description: >
          Path to the CI directory (containing pyproject.toml and uv.lock).
          Leave empty to use the tool's own directory.
        type: string
        default: ''
      source-paths:
        description: >
          The repository's own source globs, one per line and unquoted. The filter spec is derived
          from these plus the CI directory, so a caller declares its sources once. Ignored when
          `paths` is given.
        type: string
        default: ''
      paths:
        description: 'Path filters in dorny/paths-filter format (must define ci and files keys)'
        type: string
        default: ''
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  ci-tool:
    name: >-
      ${{ inputs.tool == 'bandit' && 'Bandit'
       || inputs.tool == 'import-linter' && 'import-linter'
       || inputs.tool == 'mypy' && 'mypy'
       || inputs.tool == 'ruff' && 'Ruff'
       || inputs.tool }}

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Resolve tool defaults
        id: tool
        env:
          TOOL: ${{ inputs.tool }}
          CI_DIRECTORY: ${{ inputs.ci-directory }}
          PATHS: ${{ inputs.paths }}
          SOURCE_PATHS: ${{ inputs.source-paths }}
        run: |
          # DIR is the tool's CI directory, TASKS the poe tasks to run in order,
          # and COMMENT the PR comment posted when the tool fails.
          case "$TOOL" in
            bandit)
              DIR='bandit'; TASKS='bandit'
              COMMENT='Bandit failed. Please run `uv run poe bandit` locally, fix all the issues, and commit the changes.'
              ;;
            import-linter)
              DIR='importlinter'; TASKS='import-linter'
              COMMENT='import-linter failed. Please run `uv run poe import-linter` locally, fix all the issues, and commit the changes.'
              ;;
            mypy)
              DIR='mypy'; TASKS='mypy'
              COMMENT='mypy failed. Please run `uv run poe mypy` locally, fix all the issues, and commit the changes.'
              ;;
            ruff)
              DIR='ruff'; TASKS='ruff-format-check ruff'
              COMMENT='Ruff failed. Please run `uv run poe ruff-format` and `uv run poe ruff` locally, fix all the issues, and commit the changes.'
              ;;
            *)
              echo "Unknown tool '$TOOL'."
              echo "Expected one of: bandit, import-linter, mypy, ruff."
              exit 1
              ;;
          esac

          if [ -z "$PATHS" ] && [ -z "$SOURCE_PATHS" ]; then
            echo 'One of `paths` or `source-paths` is required.'
            exit 1
          fi

          {
            echo "ci-directory=${CI_DIRECTORY:-.github/ci/$DIR}"
            echo "tasks=$TASKS"
            echo "marker=$TOOL"
            echo "comment=$COMMENT"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Checkout the CI actions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: valkyrjaio/.github
          ref: ${{ job.workflow_sha }}
          path: dot-github

      - name: Derive the path filters
        id: filters
        if: inputs.paths == ''
        env:
          CI_DIR: ${{ steps.tool.outputs.ci-directory }}
          SOURCE_PATHS: ${{ inputs.source-paths }}
        run: |
          # Both keys share the CI config that decides this tool's behavior; `files` adds the
          # repository's own sources on top. `ci` controls whether the base-branch CI directory is
          # restored, `files` whether the expensive steps run at all.
          CONFIG=$(
            printf "  - '%s/**'\n" "$CI_DIR"
            printf "  - '.github/workflows/ci.yml'\n"
          )

          {
            echo 'spec<<PATH_FILTERS_EOF'
            echo 'ci:'
            printf '%s\n' "$CONFIG"
            echo 'files:'
            printf '%s\n' "$CONFIG"
            printf '%s\n' "$SOURCE_PATHS" | while IFS= read -r glob; do
              glob=$(printf '%s' "$glob" | tr -d "\"' " )
              # `&& printf` would make an empty line the last command and, under `bash -e`,
              # fail the step. `source-paths` is a block scalar so it always ends in one.
              if [ -n "$glob" ]; then
                printf "  - '%s'\n" "$glob"
              fi
            done
            echo 'PATH_FILTERS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Determine if workflow should run based on files changed
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: ${{ inputs.paths != '' && inputs.paths || steps.filters.outputs.spec }}

      - name: Get latest CI code from target
        if: steps.changes.outputs.ci != 'true' && github.base_ref
        env:
          REF: ${{ github.base_ref }}
          CI_DIR: ${{ steps.tool.outputs.ci-directory }}
        run: |
          echo "Using CI code from $REF"
          git fetch origin "$REF"
          git checkout origin/"$REF" -- "$CI_DIR"

      - name: Setup uv
        if: steps.changes.outputs.files == 'true'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Run ${{ inputs.tool }}
        id: run
        if: steps.changes.outputs.files == 'true'
        env:
          TASKS: ${{ steps.tool.outputs.tasks }}
        run: |
          for task in $TASKS; do
            uv run poe "$task"
          done

      # The gate is the tool run step's own outcome, never `failure()`. `failure()` is true for any
      # failed step, so a broken checkout, a failed dependency install, or a failed token mint
      # posted a comment that told the developer to run the tool locally. That advice does not help,
      # because the tool never reported a problem. `!cancelled()` is required: a step whose `if:`
      # holds no status check function gets `success() &&` prepended, and the job status is already
      # `failure` here.
      # The `post-comment` action keeps one comment per marker: it removes every stale one, and it
      # posts a new one only when given a body. A passing run gives none, which clears the report an
      # earlier run left behind. The marker is the tool name, so one tool's report never removes
      # another's.
      #
      # Warning: `!cancelled()` rather than `always()`. A cancelled run has no outcome, so the body
      # would be empty and the report of the run before it would be removed while it still held.
      - name: Report the result on the pull request
        if: ${{ !cancelled() && steps.changes.outputs.files == 'true' && github.event.pull_request.number && inputs.post-pr-comment }}
        uses: ./dot-github/.github/actions/post-comment
        with:
          marker: ${{ steps.tool.outputs.marker }}
          body: ${{ steps.run.outcome == 'failure' && steps.tool.outputs.comment || '' }}
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
