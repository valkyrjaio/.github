name: Ensure Required Workflows

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  ensure-workflows:
    uses: ./.github/workflows/_ensure-workflows.yml
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
