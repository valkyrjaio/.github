name: Enforce Repository Settings

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Single repository name to target (leave empty to run on all repos)'
        type: string
        default: ''

run-name: >-
  ${{ inputs.repo
   && format('Enforce repository settings on {0}', inputs.repo)
   || format('Enforce repository settings across {0}', github.repository_owner) }}

jobs:
  enforce:
    uses: ./.github/workflows/_enforce-repo-settings.yml
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
    with:
      repo: ${{ inputs.repo || '' }}
