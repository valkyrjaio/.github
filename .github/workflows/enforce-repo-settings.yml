name: Enforce Repository Settings

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Single repository name to target (leave empty to run on all repos)'
        type: string
        default: ''

run-name: Enforce repository settings across ${{ github.repository_owner }}

jobs:
  enforce:
    uses: ./.github/workflows/_enforce-repo-settings.yml
    secrets: inherit
    with:
      repo: ${{ inputs.repo || '' }}
