name: Z Reusable Cherry-pick pull-requests to Branches

on:
  workflow_call:
    inputs:
      destination:
        description: 'Destination branch to cherry-pick to'
        required: true
        type: string
      hash:
        description: 'Hash to cherry-pick'
        required: true
        type: string
      valid-branch-pattern:
        description: 'Regex pattern for valid non-master destination branches. Leave empty to allow any branch.'
        type: string
        default: ''

jobs:
  cherry-pick:
    name: Cherry Pick ${{ inputs.hash }} to ${{ inputs.destination }}

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Ensure using valid destination branch
        env:
          BRANCH: ${{ inputs.destination }}
          PATTERN: ${{ inputs.valid-branch-pattern }}
        run: |
          if [ -n "$PATTERN" ]; then
            if [ "$BRANCH" == "master" ] || [[ $BRANCH =~ $PATTERN ]]; then
              echo "Using valid branch. Proceed."
              exit 0
            fi

            echo "Using invalid branch. Exiting."
            exit 1
          fi

          echo "No branch restriction. Proceed."

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Git user
        run: |
          git config --global user.email "${{ vars.USER_EMAIL }}"
          git config --global user.name "${{ vars.USER_NAME }}"

      - name: Backup ${{ inputs.destination }}
        run: |
          git checkout ${{ inputs.destination }}
          git push --force-with-lease origin ${{ inputs.destination }}:${{ inputs.destination }}-backup

      - name: Cherry Pick ${{ inputs.hash }} to ${{ inputs.destination }}
        run: |
          git cherry-pick ${{ inputs.hash }}
          git push origin ${{ inputs.destination }}
