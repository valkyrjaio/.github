name: Z Reusable PHP Check Outdated Dependencies

on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version to use'
        type: string
        default: '8.4'
      dependencies:
        description: >
          JSON array of dependencies to check.
          Each item must have a "name" (display name) and "command" (composer script to run).
          Example: [{"name":"PHPUnit","command":"phpunit-outdated-check-major-release"}]
        type: string
        required: true

jobs:
  check-outdated-php-dependencies:
    strategy:
      fail-fast: false
      matrix:
        dependency: ${{ fromJson(inputs.dependencies) }}

    name: "Check ${{ matrix.dependency.name }} For Outdated Direct Dependencies"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, intl

      - name: Check ${{ matrix.dependency.name }} for outdated direct dependencies
        env:
          COMPOSER_COMMAND: ${{ matrix.dependency.command }}
          NAME: ${{ matrix.dependency.name }}
        run: |
          # A *-major-release check asks whether a newer MAJOR exists. That lives
          # outside the current constraints, so `composer update` can never propose it —
          # taking a major means editing composer.json by hand. Deciding this check with
          # the resolver would make it pass unconditionally: a gate that never gates.
          # Only `composer outdated` can see across a major, and a major it reports is
          # genuinely actionable, so the report is the verdict here.
          case "$COMPOSER_COMMAND" in
            *-major-release*)
              output=$(eval "composer ${COMPOSER_COMMAND}" 2>&1) || true
              echo "$output"

              if [[ "$output" == *"All your direct dependencies are up to date"* ]]; then
                echo "No major $NAME updates outstanding. Proceeding..."
                exit 0
              fi

              echo "Major dependency updates must be taken before opening a new version line."
              exit 1
              ;;
          esac

          # Everything below is the ordinary (minor-only) check.
          #
          # `composer outdated` reports what exists on Packagist, not what this
          # dependency graph can actually resolve to. When a sibling package pins a
          # shared transitive dependency, the newer version is reported forever and no
          # update run can ever clear it — a permanently red gate for something nobody
          # can fix here. So the resolver decides: can it improve on the lock at all?
          # Within fixed constraints that question is exactly right, and unlike the
          # major case the resolver can act on the whole answer.
          #
          # The directory is embedded in the composer script ("cd <dir> && composer …"),
          # so read it from there rather than changing every caller's inputs.
          DIR=$(jq -r --arg c "${COMPOSER_COMMAND%% *}" '.scripts[$c] // "" | if type == "array" then .[0] else . end' composer.json \
            | sed -nE 's|^cd ([^ ]+) &&.*|\1|p')
          DIR=${DIR:-.}

          echo "Checking whether $NAME can resolve to anything newer (in ${DIR})..."
          resolution=$(cd "$DIR" && composer update --dry-run --no-interaction 2>&1) || true

          if echo "$resolution" | grep -q "Nothing to modify in lock file"; then
            echo "All $NAME dependencies are at their best resolvable versions. Proceeding..."
            exit 0
          fi

          echo "::group::What the resolver would change"
          echo "$resolution"
          echo "::endgroup::"

          # The resolver answers for the whole lock, transitive packages included, and
          # this gate claims only the direct ones — its name says so. A transitive
          # package publishes on a schedule nobody here sets, so deciding the gate on
          # the whole lock holds a release for a version no requirement in this
          # repository names, and the window in which the lock is current is only as
          # long as the quietest package in the graph. The direct requirements decide
          # it instead, and the dependency update run takes the rest.
          #
          # Platform packages carry no version to take, so they are dropped: `php`
          # itself, and the `ext-` / `lib-` / `composer-` families.
          direct=$(jq -r '((.require // {}) + (."require-dev" // {})) | keys[]' "$DIR/composer.json" \
            | grep -vE '^(php$|ext-|lib-|composer-)' || true)

          # Read the lock file operations alone. The dry run prints the install plan
          # directly after them with no blank line between, and that plan names the
          # same packages a second time — so the section ends at the first line that
          # is not an operation rather than at a separator.
          moved=$(printf '%s\n' "$resolution" | awk '
            /^Lock file operations:/ { inlock = 1; next }
            inlock && /^  - (Upgrading|Downgrading|Locking|Removing|Installing) / {
              sub(/^  - [A-Za-z]+ /, ""); sub(/ .*/, ""); print; next
            }
            inlock { inlock = 0 }
          ')

          blocking=$(comm -12 <(printf '%s\n' "$direct" | sort -u) <(printf '%s\n' "$moved" | sort -u))

          if [[ -z "$blocking" ]]; then
            echo "Every direct $NAME requirement is current. Only transitive packages can move, and the dependency update run takes those. Proceeding..."
            exit 0
          fi

          echo "These direct $NAME requirements can move:"
          printf '%s\n' "$blocking" | sed 's/^/  /'

          # Only now pay for the install that `composer outdated` needs — it names the
          # packages and the versions to move to, which is what makes the failure
          # actionable. It reports the whole graph, so it names transitive packages the
          # list above deliberately leaves out.
          echo "Composer dependencies must be updated before releasing:"
          eval "composer ${COMPOSER_COMMAND}" 2>&1 || true
          exit 1
