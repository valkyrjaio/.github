name: Z Reusable PHP Check Outdated Dependencies

on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version to use'
        type: string
        default: '8.4'
      dependencies:
        description: >
          JSON array of dependencies to check.
          Each item must have a "name" (display name) and "command" (composer script to run).
          Example: [{"name":"PHPUnit","command":"phpunit-outdated-check-major-release"}]
        type: string
        required: true

jobs:
  check-outdated-php-dependencies:
    strategy:
      fail-fast: false
      matrix:
        dependency: ${{ fromJson(inputs.dependencies) }}

    name: "Check ${{ matrix.dependency.name }} For Outdated Direct Dependencies"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The branch tip, not the commit that started the run. The release merges a dependency
          # bump onto the branch before this gate reads it, and the default checkout would read
          # the commit from before that merge and report the bump as still outstanding.
          ref: ${{ github.ref_name }}

      - name: Checkout the CI actions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: valkyrjaio/.github
          ref: ${{ job.workflow_sha }}
          path: dot-github

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, intl

      # `run-script` carries the pinning proof. `expected-ref` fails the step unless the checkout
      # is the commit the caller pinned. This repository's default branch holds these scripts, so an
      # empty `job.workflow_sha` would otherwise run an unpinned copy and report success.
      - name: Check ${{ matrix.dependency.name }} for outdated direct dependencies
        env:
          COMPOSER_COMMAND: ${{ matrix.dependency.command }}
          NAME: ${{ matrix.dependency.name }}
        uses: ./dot-github/.github/actions/run-script
        with:
          script: check-outdated-php-dependencies.sh
          expected-ref: ${{ job.workflow_sha }}
