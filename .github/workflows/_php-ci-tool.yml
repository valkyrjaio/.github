name: Z Reusable PHP CI Tool

on:
  workflow_call:
    inputs:
      tool:
        description: >
          Which CI tool to run: phparkitect, phpcodesniffer, phpcsfixer, phpstan,
          psalm, or rector. Selects the job's defaults — the CI directory, the
          Composer script to run, and the remediation text in the PR comment.
        type: string
        required: true
      post-pr-comment:
        description: 'Whether to post a PR comment on failure (and delete it on success)'
        type: boolean
        default: true
      composer-options:
        description: 'Additional options to pass to all Composer install steps (e.g. --ignore-platform-req=ext-openswoole)'
        type: string
        default: ''
      php-version:
        description: 'PHP version to use'
        type: string
        default: '8.4'
      ci-directory:
        description: >
          Path to the CI directory (containing composer.json and the tool config).
          Leave empty to use `.github/ci/<tool>`.
        type: string
        default: ''
      additional-directory:
        description: 'Path to an additional Composer dependencies directory (optional). Leave empty to skip.'
        type: string
        default: ''
      run-script:
        description: >
          Composer script to run (e.g. psalm-shepherd-with-stats). Leave empty to
          use the tool's own check script.
        type: string
        default: ''
      extensions:
        description: 'PHP extensions to install'
        type: string
        default: 'mbstring, intl'
      source-paths:
        description: >
          The repository's own source globs, one per line and unquoted — for example
          `src/**/*.php`. The filter spec is derived from these plus the tool's CI directory,
          so a caller declares its sources once instead of repeating a filter per tool.
          Ignored when `paths` is given.
        type: string
        default: ''
      paths:
        description: >
          Verbatim YAML filter spec for dorny/paths-filter, for a caller that needs a filter the
          derivation cannot express. Must define two keys: "ci" (the CI config files) and "files"
          (all files that should trigger the check). The "ci" key controls whether the base-branch
          CI directory is fetched; "files" controls whether the expensive steps run at all.
          Takes precedence over `source-paths`.
        type: string
        default: ''
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  ci-tool:
    name: PHP ${{ inputs.php-version }}

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Resolve tool defaults
        id: tool
        env:
          TOOL: ${{ inputs.tool }}
          CI_DIRECTORY: ${{ inputs.ci-directory }}
          RUN_SCRIPT: ${{ inputs.run-script }}
          PATHS: ${{ inputs.paths }}
          SOURCE_PATHS: ${{ inputs.source-paths }}
        run: |
          # LABEL is how the tool is addressed in the PR comment, SCRIPT the
          # Composer script CI runs, FIX the one a developer runs locally, and
          # FIXABLE whether that local run resolves the failure on its own.
          case "$TOOL" in
            phparkitect)    LABEL='PHPArkitect';      SCRIPT='phparkitect';      FIX='phparkitect';    FIXABLE=0 ;;
            phpcodesniffer) LABEL='PHP Code Sniffer'; SCRIPT='phpcodesniffer';   FIX='phpcodesniffer'; FIXABLE=0 ;;
            phpcsfixer)     LABEL='PHP CS Fixer';     SCRIPT='phpcsfixer-check'; FIX='phpcsfixer';     FIXABLE=1 ;;
            phpstan)        LABEL='PHPStan';          SCRIPT='phpstan';          FIX='phpstan';        FIXABLE=0 ;;
            psalm)          LABEL='Psalm';            SCRIPT='psalm';            FIX='psalm';          FIXABLE=0 ;;
            rector)         LABEL='Rector';           SCRIPT='rector-check';     FIX='rector';         FIXABLE=1 ;;
            *)
              echo "Unknown tool '$TOOL'."
              echo "Expected one of: phparkitect, phpcodesniffer, phpcsfixer, phpstan, psalm, rector."
              exit 1
              ;;
          esac

          if [ "$FIXABLE" -eq 1 ]; then
            REMEDY="Please run \`composer $FIX\` locally and commit the changes."
          else
            REMEDY="Please run \`composer $FIX\` locally, fix all the issues, and commit the changes."
          fi

          if [ -z "$PATHS" ] && [ -z "$SOURCE_PATHS" ]; then
            echo 'One of `paths` or `source-paths` is required.'
            exit 1
          fi

          {
            echo "ci-directory=${CI_DIRECTORY:-.github/ci/$TOOL}"
            echo "run-script=${RUN_SCRIPT:-$SCRIPT}"
            echo "marker=<!-- workflow-id: $TOOL -->"
            echo "comment=$LABEL failed. $REMEDY <!-- workflow-id: $TOOL -->"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Generate a token
        id: generate-token
        if: github.event.pull_request.number && inputs.post-pr-comment
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Derive the path filters
        id: filters
        if: inputs.paths == ''
        env:
          CI_DIR: ${{ steps.tool.outputs.ci-directory }}
          ADDITIONAL_DIR: ${{ inputs.additional-directory }}
          SOURCE_PATHS: ${{ inputs.source-paths }}
        run: |
          # Both keys share the CI config that decides this tool's behavior; `files` adds the
          # repository's own sources on top. `ci` controls whether the base-branch CI directory is
          # restored, `files` whether the expensive steps run at all.
          CONFIG=$(
            printf "  - '%s/**'\n" "$CI_DIR"
            if [ -n "$ADDITIONAL_DIR" ]; then
              printf "  - '%s/**'\n" "$ADDITIONAL_DIR"
            fi
            printf "  - '.github/workflows/ci.yml'\n"
          )

          {
            echo 'spec<<PATH_FILTERS_EOF'
            echo 'ci:'
            printf '%s\n' "$CONFIG"
            echo 'files:'
            printf '%s\n' "$CONFIG"
            printf '%s\n' "$SOURCE_PATHS" | while IFS= read -r glob; do
              glob=$(printf '%s' "$glob" | tr -d "\"' " )
              # `&& printf` would make an empty line the last command and, under `bash -e`,
              # fail the step. `source-paths` is a block scalar so it always ends in one.
              if [ -n "$glob" ]; then
                printf "  - '%s'\n" "$glob"
              fi
            done
            echo 'PATH_FILTERS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Determine if workflow should run based on files changed
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: ${{ inputs.paths != '' && inputs.paths || steps.filters.outputs.spec }}

      - name: Get latest CI code from target
        if: steps.changes.outputs.ci != 'true' && github.base_ref
        env:
          REF: ${{ github.base_ref }}
          CI_DIR: ${{ steps.tool.outputs.ci-directory }}
        run: |
          echo "Using CI code from $REF"
          git fetch origin "$REF"
          git checkout origin/"$REF" -- "$CI_DIR"

      - name: Get latest additional CI code from target
        if: inputs.additional-directory != '' && steps.changes.outputs.ci != 'true' && github.base_ref
        env:
          REF: ${{ github.base_ref }}
          ADDITIONAL_DIR: ${{ inputs.additional-directory }}
        run: |
          git checkout origin/"$REF" -- "$ADDITIONAL_DIR"

      - name: Setup PHP
        if: steps.changes.outputs.files == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.extensions }}

      - name: Install Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: ${{ inputs.composer-options }} --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")

      - name: Install CI Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: ${{ inputs.composer-options }} --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")
          working-directory: ${{ steps.tool.outputs.ci-directory }}

      - name: Install Additional Composer dependencies
        if: inputs.additional-directory != '' && steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: ${{ inputs.composer-options }} --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")
          working-directory: ${{ inputs.additional-directory }}

      - name: Run ${{ inputs.tool }}
        if: steps.changes.outputs.files == 'true'
        env:
          RUN_SCRIPT: ${{ steps.tool.outputs.run-script }}
          PSALM_ALLOW_XDEBUG: ${{ inputs.tool == 'psalm' && '1' || '' }}
        run: composer "$RUN_SCRIPT"

      - name: Report failure in PR comment
        if: failure() && github.event.pull_request.number && inputs.post-pr-comment
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MARKER: ${{ steps.tool.outputs.marker }}
          COMMENT: ${{ steps.tool.outputs.comment }}
        run: |
          # Delete every marked comment, not the first. Two concurrent runs can race on a rapid
          # double push and leave two marked comments, and a `head -1` left one of them behind
          # forever. `--paginate` reaches a marked comment after the first page of 30.
          COMMENT_IDS=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            | jq -r --arg marker "$MARKER" '.[] | select(.body | contains($marker)) | .id')
          for COMMENT_ID in $COMMENT_IDS; do
            gh api --method DELETE "repos/$GH_REPO/issues/comments/$COMMENT_ID"
          done
          gh pr comment "$PR_NUMBER" --body "$COMMENT"

      - name: Remove failure comment on success
        if: success() && steps.changes.outputs.files == 'true' && github.event.pull_request.number && inputs.post-pr-comment
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MARKER: ${{ steps.tool.outputs.marker }}
        run: |
          COMMENT_IDS=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            | jq -r --arg marker "$MARKER" '.[] | select(.body | contains($marker)) | .id')
          for COMMENT_ID in $COMMENT_IDS; do
            gh api --method DELETE "repos/$GH_REPO/issues/comments/$COMMENT_ID"
          done
