name: Reusable Aggregate Release

on:
  workflow_call:
    inputs:
      bump:
        description: 'Version component to bump'
        type: string
        required: true

jobs:
  check-version:
    uses: valkyrjaio/.github/.github/workflows/_get-version-for-release.yml@e0d0947d4a6a8631e392d4ccbc3fbe4f349e5349
    secrets: inherit
    with:
      bump: ${{ inputs.bump }}

  update-version-files:
    needs: check-version
    uses: valkyrjaio/.github/.github/workflows/_update-version-files.yml@e0d0947d4a6a8631e392d4ccbc3fbe4f349e5349
    secrets: inherit
    with:
      version: ${{ needs.check-version.outputs.version }}

  release:
    needs: [update-version-files, check-version]
    uses: ./.github/workflows/_release.yml
    secrets: inherit
    with:
      version: ${{ needs.check-version.outputs.version }}
