name: Z Reusable ErrorProne

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to use'
        type: string
        default: '21'
      ci-directory:
        description: 'Path to the CI directory (e.g. .github/ci/errorprone)'
        type: string
        required: true
      paths:
        description: 'Path filters in dorny/paths-filter format (must define ci and files keys)'
        type: string
        required: true
      copy-example-sources:
        description: 'Copy *.example.java templates to their .java target (when missing) before building'
        type: boolean
        default: false
        required: false

jobs:
  errorprone:
    name: ErrorProne

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate a token
        id: generate-token
        if: github.event.pull_request.number
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Determine if workflow should run based on files changed
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: ${{ inputs.paths }}

      - name: Get latest CI code from target
        if: steps.changes.outputs.ci != 'true' && github.base_ref
        env:
          REF: ${{ github.base_ref }}
          CI_DIR: ${{ inputs.ci-directory }}
        run: |
          echo "Using CI code from $REF"
          git fetch origin "$REF"
          git checkout origin/"$REF" -- "$CI_DIR"

      - name: Setup Java
        if: steps.changes.outputs.files == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.changes.outputs.files == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Copy example sources
        if: steps.changes.outputs.files == 'true' && inputs.copy-example-sources
        run: |
          find . -name '*.example.java' | while read -r f; do
            target="${f%.example.java}.java"
            [ -e "$target" ] || cp "$f" "$target"
          done

      - name: Run ErrorProne
        if: steps.changes.outputs.files == 'true'
        id: build_step
        working-directory: ${{ inputs.ci-directory }}
        run: gradle compileJava

      - name: Report failure in PR comment
        if: steps.build_step.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$PR_URL" ]; then
            echo "Not a pull request, skipping comment."
            exit 0
          fi

          gh pr comment "$PR_URL" --body "ErrorProne failed. Please fix all the issues locally and commit the changes."
