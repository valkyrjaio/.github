name: Z Reusable Java Update Dependencies

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to use'
        type: string
        default: '21'
      dependencies:
        description: >
          JSON array of dependencies to update.
          Each item must have a "name" (display name) and "directory" (path to the Gradle project).
          Requires the use-latest-versions plugin (se.patrikerdes.use-latest-versions).
          Example: [{"name":"JUnit","directory":".github/ci/junit"}]
        type: string
        required: true
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  update-java-dependencies:
    name: Update Java Dependencies

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Get bot user ID
        id: get-bot-user-id
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}
        run: |
          BOT_USER_ID=$(gh api "/users/$APP_SLUG[bot]" --jq '.id')
          echo "user-id=$BOT_USER_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Checkout existing PR branch if present
        id: prep-branch
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BASE: ${{ github.ref_name }}
        run: |
          # Captured while still on the base branch, before any checkout switches away from it.
          BASE_SHA=$(git rev-parse HEAD)

          EXISTING=$(gh pr list \
            --base "$BASE" \
            --state open \
            --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("deps/update-dependencies-"))] | first | .headRefName // ""')

          if [ -n "$EXISTING" ]; then
            echo "Found existing PR branch: $EXISTING"
            git fetch origin "$EXISTING"
            git checkout "$EXISTING"
            # Reuse the branch name, but never its content: useLatestVersions only ever upgrades,
            # so a version this branch already declares is one it can never walk back. Building on
            # the previous run's tree makes a bad bump permanent — re-running reports the declared
            # version as merely "exceeding" the latest and changes nothing. Resetting to the base
            # means every run recomputes the full set of updates from scratch, so the branch always
            # holds exactly base + today's updates and a bad bump disappears on the next run.
            # The tradeoff: any commit pushed onto this branch by hand is discarded.
            git reset --hard "$BASE_SHA"
            echo "branch=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "is-new=false" >> "$GITHUB_OUTPUT"
          else
            BRANCH="deps/update-dependencies-$(date +%Y-%m-%d)"
            echo "No existing PR branch. Will create: $BRANCH"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "is-new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Update dependencies
        env:
          DEPENDENCIES: ${{ inputs.dependencies }}
        run: |
          > /tmp/dependency_changes.txt

          LENGTH=$(echo "$DEPENDENCIES" | jq 'length')
          for i in $(seq 0 $((LENGTH - 1))); do
            NAME=$(echo "$DEPENDENCIES" | jq -r ".[$i].name")
            DIR=$(echo "$DEPENDENCIES" | jq -r ".[$i].directory")

            echo "Updating $NAME..."
            # --refresh-dependencies is required: Gradle caches resolved dynamic versions for 24
            # hours by default, and the versions plugin does not override that. Because
            # setup-gradle restores ~/.gradle between runs, a release published since the last
            # re-resolution would otherwise stay invisible for up to a day.
            (cd "$DIR" && gradle useLatestVersions --refresh-dependencies) || echo "useLatestVersions not available for $NAME, skipping."
          done

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "No dependency updates found."
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Dependency updates found."
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.check-changes.outputs.has-changes == 'true'
        env:
          APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}
          BOT_USER_ID: ${{ steps.get-bot-user-id.outputs.user-id }}
        run: |
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$BOT_USER_ID+$APP_SLUG[bot]@users.noreply.github.com"

      - name: Commit and push PR branch
        if: steps.check-changes.outputs.has-changes == 'true'
        id: branch
        env:
          BRANCH: ${{ steps.prep-branch.outputs.branch }}
          IS_NEW: ${{ steps.prep-branch.outputs.is-new }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          if [ "$IS_NEW" = "true" ]; then
            git checkout -b "$BRANCH"
          fi
          git add -A
          git commit \
            --author="$ACTOR <$ACTOR_ID+$ACTOR@users.noreply.github.com>" \
            -m "[Dependency] build: Update Gradle dependencies."
          git push --force-with-lease origin "$BRANCH"

      - name: Create pull request
        if: steps.check-changes.outputs.has-changes == 'true' && steps.prep-branch.outputs.is-new == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BASE: ${{ github.ref_name }}
          BRANCH: ${{ steps.prep-branch.outputs.branch }}
        run: |
          BODY=""
          BODY+="# Description"$'\n'$'\n'
          BODY+="Automated Gradle dependency updates."$'\n'$'\n'
          BODY+="## Types of changes"$'\n'$'\n'
          BODY+="- [X] Improvement _(non-breaking change which improves code)_"$'\n'
          BODY+="- [ ] Bug fix _(non-breaking change which fixes an issue)_"$'\n'
          BODY+="- [ ] New feature _(non-breaking change which adds functionality)_"$'\n'
          BODY+="- [ ] Deprecation _(breaking change which removes functionality)_"$'\n'
          BODY+="- [ ] Breaking change _(fix or feature that would cause existing functionality to change)_"$'\n'
          BODY+="- [ ] Documentation improvement"$'\n'$'\n'
          BODY+="## Changes"$'\n'$'\n'
          BODY+="_See diff for updated dependency versions._"$'\n'

          gh pr create \
            --title "[Dependency] build: Update Gradle dependencies" \
            --body "$BODY" \
            --base "$BASE" \
            --head "$BRANCH"
