name: Z Reusable Java Create Release

on:
  workflow_call:
    inputs:
      bump:
        description: 'Version component to bump (auto, patch, feature, yearly, or rc)'
        type: string
        required: true
      java-version:
        description: 'Java version to use'
        type: string
        default: '21'
      dependencies:
        description: >
          JSON array of dependencies to check for outdated versions.
          Each item must have a "name" and "directory".
          Example: [{"name":"JUnit","directory":".github/ci/junit"}]
        type: string
        required: true
      info-class-path:
        description: 'Relative path to the Info class (e.g. src/main/java/io/valkyrja/application/constant/ApplicationInfo.java). Leave empty to skip the info class update.'
        type: string
        default: ''
      info-class-name:
        description: 'Simple class name for display (e.g. ApplicationInfo). Leave empty to skip the info class update.'
        type: string
        default: ''
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  check-version:
    uses: ./.github/workflows/_get-version-for-release.yml
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
    with:
      bump: ${{ inputs.bump }}

  check-outdated-dependencies:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    uses: ./.github/workflows/_java-check-outdated-dependencies.yml
    with:
      java-version: ${{ inputs.java-version }}
      dependencies: ${{ inputs.dependencies }}

  update-version-files:
    needs: [check-outdated-dependencies, check-version]
    if: needs.check-version.outputs.should-release == 'true'
    uses: ./.github/workflows/_update-version-files.yml
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
    with:
      version: ${{ needs.check-version.outputs.version }}

  update-java-info-files:
    needs: [update-version-files, check-version]
    if: needs.check-version.outputs.should-release == 'true' && inputs.info-class-path != ''
    uses: ./.github/workflows/_java-update-info-files.yml
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
    with:
      version: ${{ needs.check-version.outputs.version }}
      build-date: ${{ needs.check-version.outputs.build-date }}
      info-class-path: ${{ inputs.info-class-path }}
      info-class-name: ${{ inputs.info-class-name }}

  release:
    needs: [update-version-files, update-java-info-files, check-version]
    if: ${{ needs.check-version.outputs.should-release == 'true' && always() && needs.check-version.result == 'success' && needs.update-version-files.result == 'success' && needs.update-java-info-files.result != 'failure' && needs.update-java-info-files.result != 'cancelled' }}
    uses: ./.github/workflows/_release.yml
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
    with:
      version: ${{ needs.check-version.outputs.version }}
