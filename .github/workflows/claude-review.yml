name: Claude Review

on:
  pull_request:
    types: [ opened, ready_for_review, synchronize, reopened ]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Review
    uses: ./.github/workflows/_claude-review.yml
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
