name: Z Reusable Python CI Tools

on:
  workflow_call:
    inputs:
      source-paths:
        description: >
          The repository's own source globs, one per line and unquoted. Each tool's filter
          spec is derived from these plus its own CI directory, so the repository declares
          its sources once for the whole suite.
        type: string
        required: true
      python-version:
        description: 'Python version to use'
        type: string
        default: '3.14'
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  ruff:
    name: Ruff
    uses: ./.github/workflows/_python-ci-tool.yml
    with:
      tool: 'ruff'
      python-version: ${{ inputs.python-version }}
      source-paths: ${{ inputs.source-paths }}
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

  mypy:
    name: mypy
    uses: ./.github/workflows/_python-ci-tool.yml
    with:
      tool: 'mypy'
      python-version: ${{ inputs.python-version }}
      source-paths: ${{ inputs.source-paths }}
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

  import-linter:
    name: import-linter
    uses: ./.github/workflows/_python-ci-tool.yml
    with:
      tool: 'import-linter'
      python-version: ${{ inputs.python-version }}
      source-paths: ${{ inputs.source-paths }}
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

  bandit:
    name: Bandit
    uses: ./.github/workflows/_python-ci-tool.yml
    with:
      tool: 'bandit'
      python-version: ${{ inputs.python-version }}
      source-paths: ${{ inputs.source-paths }}
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

  pytest:
    name: pytest
    uses: ./.github/workflows/_python-pytest.yml
    with:
      python-version: ${{ inputs.python-version }}
      source-paths: ${{ inputs.source-paths }}
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
