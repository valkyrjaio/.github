name: Z Reusable TypeScript Check Outdated Dependencies

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        type: string
        default: '22'
      dependencies:
        description: >
          JSON array of dependencies to check.
          Each item must have a "name" (display name) and "directory" (path to the package.json directory).
          Example: [{"name":"Vitest","directory":".github/ci/vitest"}]
        type: string
        required: true
      major-release:
        description: >
          When false (default, used for releases), only in-range minor/patch
          updates block — major updates outside the current semver range are
          allowed. When true (used for major version branch creation), every
          dependency must be at its latest version, including major updates.
        type: boolean
        default: false

jobs:
  check-outdated-ts-dependencies:
    strategy:
      fail-fast: false
      matrix:
        dependency: ${{ fromJson(inputs.dependencies) }}

    name: "Check ${{ matrix.dependency.name }} For Outdated Direct Dependencies"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        working-directory: ${{ matrix.dependency.directory }}
        run: npm install

      - name: Check ${{ matrix.dependency.name }} for outdated direct dependencies
        working-directory: ${{ matrix.dependency.directory }}
        env:
          MAJOR_RELEASE: ${{ inputs.major-release }}
        run: |
          outdated=$(npm outdated --json 2>/dev/null || true)

          if [ -z "$outdated" ] || [ "$outdated" = "{}" ]; then
            echo "All ${{ matrix.dependency.name }} dependencies are up to date."
            exit 0
          fi

          if [ "$MAJOR_RELEASE" = "true" ]; then
            # Major version branch: every dependency must be at its latest
            # version, including major (out-of-range) updates.
            blocking=$(echo "$outdated" | jq -r 'to_entries[] | select(.value.current != .value.latest) | .key')
            message="npm dependencies (including major versions) must be updated before creating a major version branch."
          else
            # Release: only in-range minor/patch updates are required; a major
            # update outside the current semver range does not block a release.
            blocking=$(echo "$outdated" | jq -r 'to_entries[] | select(.value.current != .value.wanted) | .key')
            message="npm dependencies must be updated before releasing."
          fi

          if [ -n "$blocking" ]; then
            npm outdated || true
            echo ""
            echo "$message"
            exit 1
          fi

          echo "All ${{ matrix.dependency.name }} dependencies are up to date for this context."
