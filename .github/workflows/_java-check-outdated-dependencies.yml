name: Z Reusable Java Check Outdated Dependencies

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to use'
        type: string
        default: '21'
      dependencies:
        description: >
          JSON array of dependencies to check.
          Each item must have a "name" (display name) and "directory" (path to the Gradle project).
          Example: [{"name":"JUnit","directory":".github/ci/junit"}]
        type: string
        required: true

jobs:
  check-outdated-java-dependencies:
    strategy:
      fail-fast: false
      matrix:
        dependency: ${{ fromJson(inputs.dependencies) }}

    name: "Check ${{ matrix.dependency.name }} For Outdated Direct Dependencies"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Check ${{ matrix.dependency.name }} for outdated dependencies
        working-directory: ${{ matrix.dependency.directory }}
        run: |
          output=$(gradle dependencyUpdates 2>&1)
          echo "$output"
          if echo "$output" | grep -q "The following dependencies have later release versions"; then
            echo ""
            echo "Outdated dependencies found in ${{ matrix.dependency.name }}! Update all dependencies before releasing."
            exit 1
          fi
          echo "All ${{ matrix.dependency.name }} dependencies are up to date."
