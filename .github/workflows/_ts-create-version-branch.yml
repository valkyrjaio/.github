name: Z Reusable TypeScript Create Version Branch

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        type: string
        default: '22'
      dependencies:
        description: >
          JSON array of dependencies to check for outdated versions.
          Each item must have a "name" and "directory".
          Example: [{"name":"Vitest","directory":".github/ci/vitest"}]
        type: string
        required: true
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  check-outdated-dependencies:
    uses: ./.github/workflows/_ts-check-outdated-dependencies.yml
    with:
      node-version: ${{ inputs.node-version }}
      dependencies: ${{ inputs.dependencies }}
      major-release: true

  get-version:
    needs: check-outdated-dependencies
    uses: ./.github/workflows/_get-version.yml
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

  create-version-branch:
    needs: get-version
    uses: ./.github/workflows/_ts-version-branch.yml
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
    with:
      version: ${{ needs.get-version.outputs.version }}
      branch: ${{ needs.get-version.outputs.branch }}
      node-version: ${{ inputs.node-version }}
