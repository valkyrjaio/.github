name: Z Reusable Auto Release Supported Versions

on:
  workflow_call:
    inputs:
      slots:
        description: 'Slot table, one slot per line: name | cron | action (deps or release) | cohorts'
        type: string
        required: true
      slot:
        description: 'Slot name to run (manual dispatch); resolved from the fired cron when empty'
        type: string
        default: ''
      schedule:
        description: 'The cron that fired this run (schedule trigger); resolves the slot when slot is empty'
        type: string
        default: ''
      stage-timeout-minutes:
        description: 'How long the slot spends waiting on the runs it dispatched, across all of them'
        type: number
        default: 30
      dry_run:
        description: 'Preview only — list dispatches without triggering any'
        type: boolean
        default: false
      repo:
        description: 'Single repository name to target (leave empty for all repos)'
        type: string
        default: ''
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  auto-release:
    name: Auto Release Supported Versions

    runs-on: ubuntu-latest

    # One slot dispatches one action to one cohort and waits only to report,
    # so a run is short. The bound is a slow release the slot waits on.
    timeout-minutes: 120

    steps:
      # The script the last step runs lives in this repository, so the job needs it on disk. Only
      # this repository calls this workflow, so the default checkout is the one that holds the
      # script. The job reads no other file from the working tree.
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Dispatch the slot across supported version branches
        env:
          # A workflow_dispatch triggered with GITHUB_TOKEN does not create a run,
          # so the sweep has to authenticate as the app. The script mints the
          # installation token itself and re-mints it as it ages, because a minted
          # token lives one hour and a wait on a slow release can approach that.
          APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
          ORG: ${{ github.repository_owner }}
          SUPPORTED_VERSIONS: ${{ vars.SUPPORTED_VERSIONS }}
          SUPPORTED_LANGUAGES: ${{ vars.SUPPORTED_LANGUAGES }}
          SLOTS: ${{ inputs.slots }}
          SLOT: ${{ inputs.slot }}
          SCHEDULE: ${{ inputs.schedule }}
          STAGE_TIMEOUT_MINUTES: ${{ inputs.stage-timeout-minutes }}
          DRY_RUN: ${{ inputs.dry_run }}
          SINGLE_REPO: ${{ inputs.repo }}
        run: .github/ci/scripts/auto-release-supported-versions.sh
