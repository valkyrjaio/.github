name: Z Reusable Auto Release Supported Versions

on:
  workflow_call:
    inputs:
      tiers:
        description: 'Release order, one tier per line, space-separated globs. Dependencies before dependents. Unmatched repos release last.'
        type: string
        required: true
      refresh-dependencies:
        description: 'Between tiers, update each repository dependencies and land the bump before the release'
        type: boolean
        default: false
      stage-timeout-minutes:
        description: 'How long to wait for one stage of one tier before the sweep gives up on it'
        type: number
        default: 30
      dry_run:
        description: 'Preview only — list dispatches without triggering any'
        type: boolean
        default: false
      repo:
        description: 'Single repository name to target (leave empty for all repos)'
        type: string
        default: ''
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  auto-release:
    name: Auto Release Supported Versions

    runs-on: ubuntu-latest

    # The sweep now waits for each tier, so it runs for as long as the releases
    # it sequences. The six hour default would let one wedged stage hold a
    # runner for most of a day.
    timeout-minutes: 180

    steps:
      # The script the last step runs lives in this repository, so the job needs it on disk. Only
      # this repository calls this workflow, so the default checkout is the one that holds the
      # script. The job reads no other file from the working tree.
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Dispatch auto releases across supported version branches
        env:
          # A workflow_dispatch triggered with GITHUB_TOKEN does not create a run,
          # so the sweep has to authenticate as the app. The script mints the
          # installation token itself and re-mints it as it ages, because a minted
          # token lives one hour and a sweep that waits between tiers runs longer.
          APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
          ORG: ${{ github.repository_owner }}
          SUPPORTED_VERSIONS: ${{ vars.SUPPORTED_VERSIONS }}
          TIERS: ${{ inputs.tiers }}
          REFRESH_DEPENDENCIES: ${{ inputs.refresh-dependencies }}
          STAGE_TIMEOUT_MINUTES: ${{ inputs.stage-timeout-minutes }}
          DRY_RUN: ${{ inputs.dry_run }}
          SINGLE_REPO: ${{ inputs.repo }}
          THIS_REPO: ${{ github.event.repository.name }}
          THIS_REF: ${{ github.ref_name }}
        run: .github/ci/scripts/auto-release-supported-versions.sh
