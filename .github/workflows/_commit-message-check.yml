name: Z Reusable Commit Message Check

on:
  workflow_call:
    inputs:
      post-pr-comment:
        description: 'Whether to post a PR comment on failure (and delete it on success)'
        type: boolean
        default: true

jobs:
  commit-message-check:
    name: Check Commit Message

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate a token
        id: generate-token
        if: github.event.pull_request.number && inputs.post-pr-comment
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Check Commit Type
        id: check-commit-type
        if: github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: gsactions/commit-message-checker@v2
        with:
          pattern: '\[[^\]]+\] .+$'
          error: 'Your first line has to contain a commit type like "[Documentation]".'
          excludeDescription: 'true'

      - name: Check No Trailing Period on PR Title
        id: check-no-trailing-period-title
        if: github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: gsactions/commit-message-checker@v2
        with:
          pattern: '.*[^.]$'
          error: 'PR title must not end with a period.'
          excludeDescription: 'true'

      - name: Check Line Length
        id: check-line-length
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMITS=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" \
            --jq '.[].commit.message')

          while IFS= read -r line; do
            if [ ${#line} -gt 120 ]; then
              echo "Line exceeds 120 characters: $line"
              exit 1
            fi
          done <<< "$COMMITS"

      - name: Check Period at end
        id: check-period-at-end
        if: github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: gsactions/commit-message-checker@v2
        with:
          pattern: '.*\.$'
          error: 'Your first line has to end in a period.'
          excludeDescription: 'true'
          excludeTitle: 'true'
          checkAllCommitMessages: 'true'
          accessToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert all checks passed
        if: |
          steps.check-commit-type.outcome == 'failure' ||
          steps.check-no-trailing-period-title.outcome == 'failure' ||
          steps.check-line-length.outcome == 'failure' ||
          steps.check-period-at-end.outcome == 'failure'
        run: exit 1

      - name: Report failure in PR comment
        if: failure() && github.event.pull_request.number && inputs.post-pr-comment
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_TYPE_OUTCOME: ${{ steps.check-commit-type.outcome }}
          NO_TRAILING_PERIOD_OUTCOME: ${{ steps.check-no-trailing-period-title.outcome }}
          LINE_LENGTH_OUTCOME: ${{ steps.check-line-length.outcome }}
          PERIOD_AT_END_OUTCOME: ${{ steps.check-period-at-end.outcome }}
        run: |
          COMMENT_ID=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- workflow-id: commit-message-check -->")) | .id' \
            | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api --method DELETE "repos/$GH_REPO/issues/comments/$COMMENT_ID"
          fi
          BODY="One or more commit message checks failed:"$'\n\n'
          if [ "$COMMIT_TYPE_OUTCOME" = "failure" ]; then
            BODY+="- PR title must start with a commit type: \`[Type] Description\`"$'\n'
          fi
          if [ "$NO_TRAILING_PERIOD_OUTCOME" = "failure" ]; then
            BODY+="- PR title must not end with a period"$'\n'
          fi
          if [ "$LINE_LENGTH_OUTCOME" = "failure" ]; then
            BODY+="- No commit message line may exceed 120 characters"$'\n'
          fi
          if [ "$PERIOD_AT_END_OUTCOME" = "failure" ]; then
            BODY+="- Each commit message (excluding PR title) must end with a period"$'\n'
          fi
          BODY+=$'\n<!-- workflow-id: commit-message-check -->'
          gh pr comment "$PR_NUMBER" --body "$BODY"

      - name: Remove failure comment on success
        if: success() && github.event.pull_request.number && inputs.post-pr-comment
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COMMENT_ID=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- workflow-id: commit-message-check -->")) | .id' \
            | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api --method DELETE "repos/$GH_REPO/issues/comments/$COMMENT_ID"
          fi
