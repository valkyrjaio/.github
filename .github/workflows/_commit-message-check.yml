name: Commit Message Check

on:
  workflow_call:

jobs:
  commit-message-check:
    name: Check Commit Message

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check Commit Type
        uses: gsactions/commit-message-checker@v2
        with:
          pattern: '\[[^\]]+\] .+$'
          error: 'Your first line has to contain a commit type like "[Documentation]".'
          excludeDescription: 'true'

      - name: Check Line Length
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMITS=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" \
            --jq '.[].commit.message')

          while IFS= read -r line; do
            if [ ${#line} -gt 120 ]; then
              echo "Line exceeds 120 characters: $line"
              exit 1
            fi
          done <<< "$COMMITS"

      - name: Check Period at end
        uses: gsactions/commit-message-checker@v2
        with:
          pattern: '.*\.$'
          error: 'Your first line has to end in a period.'
          excludeDescription: 'true'
          excludeTitle: 'true'
          checkAllCommitMessages: 'true'
          accessToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Report failure in PR comment
        if: failure() && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "Commit message does not adhere to requirements. Please fix this."
