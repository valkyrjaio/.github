name: Z Reusable Commit Message Check

# The pull request title and every commit on the branch follow `[Root] type: Description`.
#
# Four checks run, and three of them are a third-party action rather than a script, so they cannot
# be one script the way the other checks in this repository are. What they share is the report, and
# `commit-message-report.sh` writes that from the four outcomes. The `post-comment` action then
# keeps it on the pull request, in place of the copy of that logic this workflow used to hold.
#
# The actions live in this repository, and an action cannot fetch the files it is itself made of.
# The job therefore checks this repository out at `job.workflow_sha` first, which is the commit the
# caller pinned, and reaches the actions and the scripts through that checkout.

on:
  workflow_call:
    inputs:
      post-pr-comment:
        description: 'Whether to post a PR comment on failure (and delete it on success)'
        type: boolean
        default: true
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  check:
    name: Check Commit Message

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Checkout the CI actions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: valkyrjaio/.github
          ref: ${{ job.workflow_sha }}
          path: dot-github

      # Every check below is `continue-on-error`, so all four report an outcome and the report names
      # every rule that failed. Without it the first failure would end the job, and a contributor
      # would learn of the next rule only after fixing this one.
      - name: Check Root And Type
        id: check-commit-type
        if: github.actor != 'dependabot[bot]' && !startsWith(github.event.pull_request.title, 'Revert "')
        continue-on-error: true
        uses: gsactions/commit-message-checker@16fa2d5de096ae0d35626443bcd24f1e756cafee # v2.0.0
        with:
          flags: 'g'
          pattern: '^(\[[^\]]+\])+ (feat|fix|deprecate|docs|test|refactor|perf|style|build|ci|chore|revert)(\(#[0-9]+\))?!?: .+'
          error: 'Subject must be "[Root] type: Description" — e.g. "[Http] fix: Normalize header casing." See CONTRIBUTING.md for the roots and types.'
          excludeDescription: 'true'
          checkAllCommitMessages: 'true'
          accessToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Check No Trailing Period on PR Title
        id: check-no-trailing-period-title
        if: github.actor != 'dependabot[bot]' && !startsWith(github.event.pull_request.title, 'Revert "')
        continue-on-error: true
        uses: gsactions/commit-message-checker@16fa2d5de096ae0d35626443bcd24f1e756cafee # v2.0.0
        with:
          pattern: '.*[^.]$'
          error: 'PR title must not end with a period.'
          excludeDescription: 'true'

      - name: Check Line Length
        id: check-line-length
        if: '!startsWith(github.event.pull_request.title, ''Revert "'')'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        uses: ./dot-github/.github/actions/run-script
        with:
          script: commit-message-line-length.sh
          expected-ref: ${{ job.workflow_sha }}

      - name: Check Period at end
        id: check-period-at-end
        if: github.actor != 'dependabot[bot]' && !startsWith(github.event.pull_request.title, 'Revert "')
        continue-on-error: true
        uses: gsactions/commit-message-checker@16fa2d5de096ae0d35626443bcd24f1e756cafee # v2.0.0
        with:
          pattern: '.*\.$'
          error: 'Each commit on the branch has to end in a period (the PR title must not).'
          excludeDescription: 'true'
          excludeTitle: 'true'
          checkAllCommitMessages: 'true'
          accessToken: ${{ secrets.GITHUB_TOKEN }}

      # The script writes the report and decides the result, so it fails when any check above did.
      # `continue-on-error` keeps that from ending the job here, so the report reaches the comment.
      - name: Build the report
        id: report
        continue-on-error: true
        uses: ./dot-github/.github/actions/run-script
        with:
          script: commit-message-report.sh
          expected-ref: ${{ job.workflow_sha }}
          env: |
            COMMIT_TYPE_OUTCOME=${{ steps.check-commit-type.outcome }}
            NO_TRAILING_PERIOD_OUTCOME=${{ steps.check-no-trailing-period-title.outcome }}
            LINE_LENGTH_OUTCOME=${{ steps.check-line-length.outcome }}
            PERIOD_AT_END_OUTCOME=${{ steps.check-period-at-end.outcome }}

      # A passing check posts no body, which removes the report an earlier run left behind.
      - name: Report the result on the pull request
        if: ${{ !cancelled() && inputs.post-pr-comment && github.event.pull_request.number }}
        uses: ./dot-github/.github/actions/post-comment
        with:
          marker: commit-message-check
          body: ${{ steps.report.outputs.outcome == 'failure' && steps.report.outputs.report || '' }}
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      # Warning: `!cancelled()` rather than `always()`. With `always()` a cancelled run reaches
      # this step, reads an empty outcome, and fails the job instead of reporting it as cancelled.
      - name: Fail when a check failed
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.report.outputs.outcome }}
        run: |
          if [[ "$OUTCOME" != 'success' ]]; then
            echo 'A commit message check reported a failure. Its output is above, and on the pull request.'
            exit 1
          fi
