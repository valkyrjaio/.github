name: Z Reusable Create Repository

on:
  workflow_call:
    inputs:
      name:
        description: 'Repository name (without org prefix)'
        type: string
        required: true
      description:
        description: 'Repository description'
        type: string
        required: true
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  create-repo:
    name: "Create ${{ github.repository_owner }}/${{ inputs.name }}"

    runs-on: ubuntu-latest

    steps:
      - name: Validate inputs
        env:
          DESCRIPTION: ${{ inputs.description }}
        run: |
          if [[ "$DESCRIPTION" == *. ]]; then
            echo "Error: description must not end with a period."
            exit 1
          fi

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Create and configure repository
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          REPO_NAME: ${{ inputs.name }}
          DESCRIPTION: ${{ inputs.description }}
        run: |
          # A repo's language is the final '-'-delimited segment of its name
          # (see REPOSITORY_NAMING.md): valkyrja-php → php, ci-junit-java → java,
          # sindri-ts → ts. It only counts as a language when listed in the
          # org-level vars.SUPPORTED_LANGUAGES (space-separated), so e.g.
          # some-global-repo resolves to nothing.
          LANG_SUFFIX=$(echo "${REPO_NAME##*-}" | tr '[:upper:]' '[:lower:]')

          # Scaffold from project-template-<lang> when the repo targets a known
          # language — except for the project templates themselves, which have no
          # template of their own (and must not reference one that may not exist
          # yet when a new language is introduced).
          TEMPLATE_FLAG=""
          if [[ " ${{ vars.SUPPORTED_LANGUAGES }} " == *" $LANG_SUFFIX "* && "$REPO_NAME" != project-template-* ]]; then
            echo "Detected language '$LANG_SUFFIX'; using template $ORG/project-template-$LANG_SUFFIX"
            TEMPLATE_FLAG="--template $ORG/project-template-$LANG_SUFFIX"
          else
            echo "No language template for '$REPO_NAME'; creating a bare repo."
          fi

          gh repo create "$ORG/$REPO_NAME" \
            --public \
            --description "$DESCRIPTION" \
            $TEMPLATE_FLAG

          gh api --method PATCH "repos/$ORG/$REPO_NAME" \
            --field allow_squash_merge=true \
            --field allow_merge_commit=false \
            --field allow_rebase_merge=false \
            --field delete_branch_on_merge=true \
            --field squash_merge_commit_title="PR_TITLE" \
            --field squash_merge_commit_message="PR_BODY" \
            --field has_wiki=false \
            --field has_projects=false

          gh api --method PUT "repos/$ORG/$REPO_NAME/vulnerability-alerts" > /dev/null
          gh api --method PUT "repos/$ORG/$REPO_NAME/automated-security-fixes" > /dev/null
          gh api --method PUT "repos/$ORG/$REPO_NAME/immutable-releases" > /dev/null

      - name: Apply branch rulesets
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          REPO_NAME: ${{ inputs.name }}
        run: |
          shopt -s nullglob

          for ruleset_file in rulesets/*.json; do
            echo "Applying ruleset: $(basename "$ruleset_file")"
            jq '{name, target, enforcement, conditions, rules, bypass_actors}' "$ruleset_file" \
              | gh api --method POST "repos/$ORG/$REPO_NAME/rulesets" --input -
          done

          # Apply language-specific rulesets from rulesets/<lang>/ for known
          # languages (same suffix rule as the template step).
          LANG_SUFFIX=$(echo "${REPO_NAME##*-}" | tr '[:upper:]' '[:lower:]')
          if [[ " ${{ vars.SUPPORTED_LANGUAGES }} " == *" $LANG_SUFFIX "* && -d "rulesets/$LANG_SUFFIX" ]]; then
            echo "Applying $LANG_SUFFIX-specific rulesets..."
            for ruleset_file in rulesets/"$LANG_SUFFIX"/*.json; do
              echo "Applying $LANG_SUFFIX ruleset: $(basename "$ruleset_file")"
              jq '{name, target, enforcement, conditions, rules, bypass_actors}' "$ruleset_file" \
                | gh api --method POST "repos/$ORG/$REPO_NAME/rulesets" --input -
            done
          fi
