name: Z Reusable Go Update Dependencies

on:
  workflow_call:
    inputs:
      dependencies:
        description: >
          JSON array of dependencies to update.
          Each item must have a "name" (display name) and "directory" (path to the directory
          containing a go.mod).
          Directories whose go.mod declares a `tool` directive are updated with `go get tool`;
          all others with `go get -u ./...`.
          Example: [{"name":"golangci-lint","directory":".github/ci/lint"}]
        type: string
        required: true

jobs:
  update-go-dependencies:
    name: Update Go Dependencies

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Get bot user ID
        id: get-bot-user-id
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}
        run: |
          BOT_USER_ID=$(gh api "/users/$APP_SLUG[bot]" --jq '.id')
          echo "user-id=$BOT_USER_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Checkout existing PR branch if present
        id: prep-branch
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BASE: ${{ github.ref_name }}
        run: |
          EXISTING=$(gh pr list \
            --base "$BASE" \
            --state open \
            --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("deps/update-dependencies-"))] | first | .headRefName // ""')

          if [ -n "$EXISTING" ]; then
            echo "Found existing PR branch: $EXISTING"
            git fetch origin "$EXISTING"
            git checkout "$EXISTING"
            echo "branch=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "is-new=false" >> "$GITHUB_OUTPUT"
          else
            BRANCH="deps/update-dependencies-$(date +%Y-%m-%d)"
            echo "No existing PR branch. Will create: $BRANCH"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "is-new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Update dependencies
        env:
          DEPENDENCIES: ${{ inputs.dependencies }}
        run: |
          > /tmp/dependency_changes.txt

          # Extract "<module>\t<version>" for every pinned requirement in a go.mod,
          # so the before/after snapshots can be diffed into a change table.
          # Comments are stripped first so "// indirect" markers do not become fields,
          # and a leading single-line "require " prefix is removed so both the block
          # and single-line require forms parse identically. The `$1 ~ /\./` guard
          # keeps module paths (which always contain a dot) and drops the `go` and
          # `toolchain` directives.
          cat > /tmp/snapshot_gomod.sh <<'SH'
          #!/bin/sh
          # LC_ALL=C so the sort order matches the collation `join` expects below.
          sed -e 's|//.*||' "$1/go.mod" \
            | sed -e 's|^[[:space:]]*require[[:space:]]*||' \
            | awk '$1 ~ /\./ && $2 ~ /^v/ { print $1 "\t" $2 }' \
            | LC_ALL=C sort -u
          SH
          chmod +x /tmp/snapshot_gomod.sh

          LENGTH=$(echo "$DEPENDENCIES" | jq 'length')
          for i in $(seq 0 $((LENGTH - 1))); do
            NAME=$(echo "$DEPENDENCIES" | jq -r ".[$i].name")
            DIR=$(echo "$DEPENDENCIES" | jq -r ".[$i].directory")

            if [ ! -f "$DIR/go.mod" ]; then
              echo "No go.mod in $DIR, skipping $NAME."
              continue
            fi

            echo "Updating $NAME ($DIR)..."
            /tmp/snapshot_gomod.sh "$DIR" > /tmp/before.txt

            if grep -qE '^tool[ (]' "$DIR/go.mod"; then
              # Tool module (e.g. a pinned golangci-lint): it declares no packages of
              # its own, so ./... would match nothing. The `tool` meta-pattern updates
              # every tool listed in the go.mod instead.
              #
              # Deliberately no `-u`: the tool itself still moves to its latest
              # release, but its dependencies are then resolved by MVS from that
              # release's own go.mod. `-u` would instead drag the whole transitive
              # graph to latest, including modules whose newest release is
              # API-incompatible with the tool — a build that the tool's authors
              # never sanctioned. That is not hypothetical: go-header v1.0.0 rewrote
              # its API under the same module path (no /v2), and `-u` pulled it into
              # a golangci-lint v2.12.2 that requires v0.5.0, so the pinned linter no
              # longer compiled and every consumer's lint job failed.
              ( cd "$DIR" && go get tool )
            elif find "$DIR" -name '*.go' -not -path '*/vendor/*' | head -1 | grep -q .; then
              ( cd "$DIR" && go get -u ./... )
            else
              echo "$NAME has no Go packages and no tool directive; tidying only."
            fi

            ( cd "$DIR" && go mod tidy )

            /tmp/snapshot_gomod.sh "$DIR" > /tmp/after.txt
            LC_ALL=C join -t "$(printf '\t')" -j 1 -o 0,1.2,2.2 /tmp/before.txt /tmp/after.txt \
              | awk -F'\t' '$2 != $3 { print $1 "|" $2 "|" $3 }' >> /tmp/dependency_changes.txt
          done

          LC_ALL=C sort -u -o /tmp/dependency_changes.txt /tmp/dependency_changes.txt

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "No dependency updates found."
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Dependency updates found."
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.check-changes.outputs.has-changes == 'true'
        env:
          APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}
          BOT_USER_ID: ${{ steps.get-bot-user-id.outputs.user-id }}
        run: |
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$BOT_USER_ID+$APP_SLUG[bot]@users.noreply.github.com"

      - name: Commit and push PR branch
        if: steps.check-changes.outputs.has-changes == 'true'
        id: branch
        env:
          BRANCH: ${{ steps.prep-branch.outputs.branch }}
          IS_NEW: ${{ steps.prep-branch.outputs.is-new }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          if [ "$IS_NEW" = "true" ]; then
            git checkout -b "$BRANCH"
          fi
          git add -A
          git commit \
            --author="$ACTOR <$ACTOR_ID+$ACTOR@users.noreply.github.com>" \
            -m "[Dependency] build: Update Go dependencies."
          git push --force-with-lease origin "$BRANCH"

      - name: Create pull request
        if: steps.check-changes.outputs.has-changes == 'true' && steps.prep-branch.outputs.is-new == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BASE: ${{ github.ref_name }}
          BRANCH: ${{ steps.prep-branch.outputs.branch }}
          REVIEWER: ${{ vars.VALKYRJA_REVIEWER }}
        run: |
          BODY=""
          BODY+="# Description"$'\n'$'\n'
          BODY+="Automated Go dependency updates."$'\n'$'\n'
          BODY+="## Types of changes"$'\n'$'\n'
          BODY+="- [X] Improvement _(non-breaking change which improves code)_"$'\n'
          BODY+="- [ ] Bug fix _(non-breaking change which fixes an issue)_"$'\n'
          BODY+="- [ ] New feature _(non-breaking change which adds functionality)_"$'\n'
          BODY+="- [ ] Deprecation _(breaking change which removes functionality)_"$'\n'
          BODY+="- [ ] Breaking change _(fix or feature that would cause existing functionality to change)_"$'\n'
          BODY+="- [ ] Documentation improvement"$'\n'$'\n'
          BODY+="## Changes"$'\n'$'\n'

          if [ -s /tmp/dependency_changes.txt ]; then
            BODY+="| Module | From | To |"$'\n'
            BODY+="|--------|------|----|"$'\n'
            while IFS='|' read -r mod from to; do
              BODY+="| \`$mod\` | $from | $to |"$'\n'
            done < /tmp/dependency_changes.txt
          else
            BODY+="_No pinned version changes detected — go.sum updates only._"$'\n'
          fi

          REVIEWER_FLAGS=""
          if [ -n "$REVIEWER" ]; then
            REVIEWER_FLAGS="--assignee $REVIEWER --reviewer $REVIEWER"
          fi

          gh pr create \
            --title "[Dependency] build: Update Go dependencies" \
            --body "$BODY" \
            --base "$BASE" \
            --head "$BRANCH" \
            $REVIEWER_FLAGS
