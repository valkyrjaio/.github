name: Z Reusable Go Update Dependencies

on:
  workflow_call:
    inputs:
      dependencies:
        description: >
          JSON array of dependencies to update.
          Each item must have a "name" (display name) and "directory" (path to the directory
          containing a go.mod).
          Directories whose go.mod declares a `tool` directive are updated with `go get tool`;
          all others with `go get -u ./...`.
          Example: [{"name":"golangci-lint","directory":".github/ci/lint"}]
        type: string
        required: true
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  update-go-dependencies:
    name: Update Go Dependencies

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Get bot user ID
        id: get-bot-user-id
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}
        run: |
          BOT_USER_ID=$(gh api "/users/$APP_SLUG[bot]" --jq '.id')
          echo "user-id=$BOT_USER_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ steps.generate-token.outputs.token }}

      # The scripts the next steps run live in this repository, and the checkout above holds the
      # calling repository.
      - name: Checkout the CI scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: valkyrjaio/.github
          ref: ${{ job.workflow_sha }}
          path: dot-github

      # Warning: `git add -A` stages a nested checkout as a gitlink. Without this the dependency
      # commit would carry a stray `dot-github` submodule entry.
      - name: Keep the CI scripts out of the dependency commit
        run: printf '%s\n' 'dot-github/' >> .git/info/exclude

      - name: Checkout existing PR branch if present
        id: prep-branch
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BASE: ${{ github.ref_name }}
        run: dot-github/.github/ci/scripts/checkout-existing-pr-branch.sh

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Update dependencies
        env:
          DEPENDENCIES: ${{ inputs.dependencies }}
          # GONOPROXY takes valkyrjaio modules off proxy.golang.org, whose cached
          # version list can hide a first-party release from minutes earlier.
          # Deliberately not GOPRIVATE: that also takes these modules off the
          # checksum database, and the hash this step writes into go.sum is
          # committed and merged unread. Only the version list goes stale, so only
          # the proxy is bypassed.
          GONOPROXY: github.com/valkyrjaio/*
        run: dot-github/.github/ci/scripts/update-go-dependencies.sh

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "No dependency updates found."
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Dependency updates found."
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.check-changes.outputs.has-changes == 'true'
        env:
          APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}
          BOT_USER_ID: ${{ steps.get-bot-user-id.outputs.user-id }}
        run: |
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$BOT_USER_ID+$APP_SLUG[bot]@users.noreply.github.com"

      - name: Commit and push PR branch
        if: steps.check-changes.outputs.has-changes == 'true'
        id: branch
        env:
          BRANCH: ${{ steps.prep-branch.outputs.branch }}
          IS_NEW: ${{ steps.prep-branch.outputs.is-new }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          if [ "$IS_NEW" = "true" ]; then
            git checkout -b "$BRANCH"
          fi
          git add -A
          git commit \
            --author="$ACTOR <$ACTOR_ID+$ACTOR@users.noreply.github.com>" \
            -m "[Dependency] build: Update Go dependencies."
          git push --force-with-lease origin "$BRANCH"

      - name: Create pull request
        if: steps.check-changes.outputs.has-changes == 'true' && steps.prep-branch.outputs.is-new == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BASE: ${{ github.ref_name }}
          BRANCH: ${{ steps.prep-branch.outputs.branch }}
          TITLE: '[Dependency] build: Update Go dependencies'
          SUMMARY: 'Automated Go dependency updates.'
          COLUMN_HEADING: 'Module'
          CHANGES_MESSAGE: '_No pinned version changes detected — go.sum updates only._'
        run: dot-github/.github/ci/scripts/create-dependency-pull-request.sh
