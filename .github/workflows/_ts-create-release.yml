name: Z Reusable TypeScript Create Release

on:
  workflow_call:
    inputs:
      bump:
        description: 'Version component to bump'
        type: string
        required: true
      node-version:
        description: 'Node.js version to use'
        type: string
        default: '22'
      dependencies:
        description: >
          JSON array of dependencies to check for outdated versions.
          Each item must have a "name" and "directory".
          Example: [{"name":"Vitest","directory":".github/ci/vitest"}]
        type: string
        required: true
      info-file-path:
        description: 'Relative path to the ApplicationInfo.ts file (e.g. src/Valkyrja/Application/Constant/ApplicationInfo.ts). Leave empty to skip the info file update.'
        type: string
        default: ''
      info-file-name:
        description: 'Simple file name for display (e.g. ApplicationInfo). Leave empty to skip the info file update.'
        type: string
        default: ''

jobs:
  check-version:
    uses: ./.github/workflows/_get-version-for-release.yml
    secrets: inherit
    with:
      bump: ${{ inputs.bump }}

  check-outdated-dependencies:
    needs: check-version
    uses: ./.github/workflows/_ts-check-outdated-dependencies.yml
    secrets: inherit
    with:
      node-version: ${{ inputs.node-version }}
      dependencies: ${{ inputs.dependencies }}

  update-version-files:
    needs: [check-outdated-dependencies, check-version]
    uses: ./.github/workflows/_update-version-files.yml
    secrets: inherit
    with:
      version: ${{ needs.check-version.outputs.version }}

  update-ts-package-json:
    needs: [update-version-files, check-version]
    uses: ./.github/workflows/_ts-update-package-json.yml
    secrets: inherit
    with:
      version: ${{ needs.check-version.outputs.version }}
      node-version: ${{ inputs.node-version }}

  update-ts-info-files:
    needs: [update-ts-package-json, check-version]
    if: inputs.info-file-path != ''
    uses: ./.github/workflows/_ts-update-info-files.yml
    secrets: inherit
    with:
      version: ${{ needs.check-version.outputs.version }}
      build-date: ${{ needs.check-version.outputs.build-date }}
      info-file-path: ${{ inputs.info-file-path }}
      info-file-name: ${{ inputs.info-file-name }}

  release:
    needs: [update-version-files, update-ts-package-json, update-ts-info-files, check-version]
    if: ${{ always() && needs.check-version.result == 'success' && needs.update-version-files.result == 'success' && needs.update-ts-package-json.result == 'success' && needs.update-ts-info-files.result != 'failure' }}
    uses: ./.github/workflows/_release.yml
    secrets: inherit
    with:
      version: ${{ needs.check-version.outputs.version }}
