name: Z Reusable ESLint TypeScript

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        type: string
        default: '22'
      ci-directory:
        description: 'Path to the CI directory (containing package.json and the ESLint config)'
        type: string
        default: '.github/ci/eslint'
      additional-directory:
        description: 'Path to an additional CI dependencies directory (optional). Leave empty to skip.'
        type: string
        default: ''
      paths:
        description: 'Path filters in dorny/paths-filter format (must define ci and files keys)'
        type: string
        required: true

jobs:
  eslint:
    name: ESLint

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate a token
        id: generate-token
        if: github.event.pull_request.number
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Determine if workflow should run based on files changed
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: ${{ inputs.paths }}

      - name: Get latest CI code from target
        if: steps.changes.outputs.ci != 'true' && github.base_ref
        env:
          REF: ${{ github.base_ref }}
          CI_DIR: ${{ inputs.ci-directory }}
        run: |
          echo "Using CI code from $REF"
          git fetch origin "$REF"
          git checkout origin/"$REF" -- "$CI_DIR"

      - name: Get latest additional CI code from target
        if: inputs.additional-directory != '' && steps.changes.outputs.ci != 'true' && github.base_ref
        env:
          REF: ${{ github.base_ref }}
          ADDITIONAL_DIR: ${{ inputs.additional-directory }}
        run: |
          git checkout origin/"$REF" -- "$ADDITIONAL_DIR"

      - name: Setup Node.js
        if: steps.changes.outputs.files == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.ci-directory }}/package-lock.json

      - name: Install additional CI dependencies
        if: inputs.additional-directory != '' && steps.changes.outputs.files == 'true'
        working-directory: ${{ inputs.additional-directory }}
        run: npm ci

      - name: Install CI dependencies
        if: steps.changes.outputs.files == 'true'
        working-directory: ${{ inputs.ci-directory }}
        run: npm ci

      - name: Install root dependencies
        if: steps.changes.outputs.files == 'true' && hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Run ESLint
        if: steps.changes.outputs.files == 'true'
        id: eslint
        run: npm run eslint

      - name: Report failure in PR comment
        if: failure() && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COMMENT_ID=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- workflow-id: eslint -->")) | .id' \
            | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api --method DELETE "repos/$GH_REPO/issues/comments/$COMMENT_ID"
          fi
          gh pr comment "$PR_NUMBER" --body "ESLint failed. Please run \`npm run eslint\` locally, fix all the issues, and commit the changes. <!-- workflow-id: eslint -->"

      - name: Remove failure comment on success
        if: success() && steps.changes.outputs.files == 'true' && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COMMENT_ID=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- workflow-id: eslint -->")) | .id' \
            | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api --method DELETE "repos/$GH_REPO/issues/comments/$COMMENT_ID"
          fi
