name: Z Reusable Ensure Reusable Workflow Names

on:
  workflow_call:
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  ensure-reusable-workflow-names:
    name: Ensure Reusable Workflow Names

    runs-on: ubuntu-latest

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # The script the last step runs lives in this repository, so the job needs it on disk. Only
      # this repository calls this workflow, so the default checkout is the one that holds the
      # script. The job reads no other file from the working tree.
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Ensure reusable workflow names and filenames are correct
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          REVIEWER: ${{ vars.VALKYRJA_REVIEWER }}
          SUPPORTED_VERSIONS: ${{ vars.SUPPORTED_VERSIONS }}
        run: .github/ci/scripts/ensure-reusable-workflow-names.sh
