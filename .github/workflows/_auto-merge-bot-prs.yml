name: Z Reusable Auto Merge Bot Pull Requests

on:
  workflow_call:
    inputs:
      bot-login:
        description: 'Author login whose pull requests may auto-merge (e.g. app/valkyrja-volundr)'
        type: string
        required: true
      types:
        description: 'Comma-separated title roots to auto-merge (e.g. Dependency,Workflow)'
        type: string
        required: true
      exclude-repos:
        description: 'Comma-separated repository names to leave alone'
        type: string
        default: ''
      dry_run:
        description: 'Preview only — report what would merge without merging any'
        type: boolean
        default: false
      repo:
        description: 'Single repository name to target (leave empty for all repos)'
        type: string
        default: ''
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  auto-merge:
    name: Auto Merge Bot Pull Requests

    runs-on: ubuntu-latest

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # The script the last step runs lives in this repository, so the job needs it on disk. Only
      # this repository calls this workflow, so the default checkout is the one that holds the
      # script. The job reads no other file from the working tree.
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Merge qualifying bot pull requests
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          BOT_LOGIN: ${{ inputs.bot-login }}
          ENABLED_TYPES: ${{ inputs.types }}
          EXCLUDE_REPOS: ${{ inputs.exclude-repos }}
          SUPPORTED_VERSIONS: ${{ vars.SUPPORTED_VERSIONS }}
          DRY_RUN: ${{ inputs.dry_run }}
          SINGLE_REPO: ${{ inputs.repo }}
        run: .github/ci/scripts/auto-merge-bot-prs.sh
