name: Z Reusable Python Check Outdated Dependencies

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        type: string
        default: '3.14'
      dependencies:
        description: >
          JSON array of dependencies to check.
          Each item must have a "name" (display name) and "directory" (path to the
          directory containing a pyproject.toml and uv.lock).
          Example: [{"name":"Ruff","directory":".github/ci/ruff"}]
        type: string
        required: true
      major-release:
        description: >
          When false (default, used for releases), the lock is upgraded within the
          declared version constraints. When true (used for major version branch
          creation), the same check applies. Valkyrja uses lower-bound-only
          constraints, so `uv lock --upgrade` resolves to the latest available in
          both cases; the flag only changes the failure message.
        type: boolean
        default: false

jobs:
  check-outdated-python-dependencies:
    strategy:
      fail-fast: false
      matrix:
        dependency: ${{ fromJson(inputs.dependencies) }}

    name: "Check ${{ matrix.dependency.name }} For Outdated Direct Dependencies"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Check ${{ matrix.dependency.name }} for outdated direct dependencies
        working-directory: ${{ matrix.dependency.directory }}
        env:
          MAJOR_RELEASE: ${{ inputs.major-release }}
          NAME: ${{ matrix.dependency.name }}
        run: |
          uv lock --upgrade --quiet

          if git diff --quiet -- uv.lock; then
            echo "All $NAME dependencies are up to date."
            exit 0
          fi

          echo "::group::Outdated $NAME dependencies"
          git --no-pager diff -- uv.lock || true
          echo "::endgroup::"

          if [ "$MAJOR_RELEASE" = "true" ]; then
            echo "Python dependencies (including major versions) must be updated before creating a major version branch."
          else
            echo "Python dependencies must be updated before releasing."
          fi
          exit 1
