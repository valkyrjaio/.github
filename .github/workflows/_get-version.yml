name: Z Reusable Get Version

on:
  workflow_call:
    outputs:
      version:
        description: 'The new major version number'
        value: ${{ jobs.get-version.outputs.version }}
      branch:
        description: 'The new branch name (e.g. 27.x)'
        value: ${{ jobs.get-version.outputs.branch }}
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  get-version:
    name: Get Version

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      branch: ${{ steps.branch.outputs.branch }}

    steps:
      - name: Ensure running from master
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" != "master" ]; then
            echo "New major release version branches must be created from master."
            exit 1
          fi
          echo "Using master. Proceed."

      - name: Determine new version
        id: version
        env:
          LATEST_MAJOR_VERSION: ${{ vars.LATEST_MAJOR_VERSION }}
        run: |
          if [ -z "$LATEST_MAJOR_VERSION" ]; then
            YEAR=$(date +%Y)
            YEAR_SHORT="${YEAR:2}"
            LATEST_MAJOR_VERSION=$((YEAR_SHORT - 1))
            echo "LATEST_MAJOR_VERSION not set, falling back to current year minus one: $LATEST_MAJOR_VERSION"
          fi
          NEW_VERSION=$((LATEST_MAJOR_VERSION + 1))
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Format branch name
        id: branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "branch=${VERSION}.x" >> "$GITHUB_OUTPUT"

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Validate new version is supported
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SUPPORTED_VERSIONS: ${{ vars.SUPPORTED_VERSIONS }}
        run: |
          if [ -z "$SUPPORTED_VERSIONS" ]; then
            echo "SUPPORTED_VERSIONS not set; skipping version support check."
          elif ! [[ "$VERSION" =~ $SUPPORTED_VERSIONS ]]; then
            echo "Cannot create ${{ steps.branch.outputs.branch }}: version $VERSION is not in the supported versions ($SUPPORTED_VERSIONS). Aborting."
            exit 1
          else
            echo "Version $VERSION matches supported versions ($SUPPORTED_VERSIONS). Proceeding."
          fi

      - name: Check if branch already exists
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          if gh api "repos/${{ github.repository }}/branches/${BRANCH}" --silent 2>/dev/null; then
            echo "Major version branch '$BRANCH' already exists! Aborting."
            exit 1
          fi
          echo "Branch '$BRANCH' does not exist. Proceeding."
