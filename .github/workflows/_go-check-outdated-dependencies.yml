name: Z Reusable Go Check Outdated Dependencies

on:
  workflow_call:
    inputs:
      dependencies:
        description: >
          JSON array of dependencies to check.
          Each item must have a "name" (display name) and "directory" (path to the directory
          containing a go.mod).
          Example: [{"name":"golangci-lint","directory":".github/ci/lint"}]
        type: string
        required: true

jobs:
  check-outdated-go-dependencies:
    strategy:
      fail-fast: false
      matrix:
        dependency: ${{ fromJson(inputs.dependencies) }}

    name: "Check ${{ matrix.dependency.name }} For Outdated Dependencies"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The branch tip, not the commit that started the run. The release merges a dependency
          # bump onto the branch before this gate reads it, and the default checkout would read
          # the commit from before that merge and report the bump as still outstanding.
          ref: ${{ github.ref_name }}

      - name: Checkout the CI actions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: valkyrjaio/.github
          ref: ${{ job.workflow_sha }}
          path: dot-github

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Check ${{ matrix.dependency.name }} for outdated dependencies
        working-directory: ${{ matrix.dependency.directory }}
        env:
          NAME: ${{ matrix.dependency.name }}
          # GONOPROXY takes valkyrjaio modules off proxy.golang.org, whose cached
          # version list can hide a first-party release from minutes earlier.
          # Matches _go-update-dependencies.yml, which performs the same upgrade.
          # The two must resolve versions the same way, or this check disagrees
          # with the updater.
          GONOPROXY: github.com/valkyrjaio/*
        run: '"$GITHUB_WORKSPACE/dot-github/.github/ci/scripts/check-outdated-go-dependencies.sh"'
