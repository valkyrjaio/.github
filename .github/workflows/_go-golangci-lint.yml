name: Z Reusable Go golangci-lint

on:
  workflow_call:
    inputs:
      ci-directory:
        description: 'Path to the CI lint tool directory (containing the pinned golangci-lint go.mod)'
        type: string
        default: '.github/ci/lint'
      paths:
        description: 'Path filters in dorny/paths-filter format (must define ci and files keys)'
        type: string
        required: true

jobs:
  golangci-lint:
    name: golangci-lint

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Generate a token
        id: generate-token
        if: github.event.pull_request.number
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Determine if workflow should run based on files changed
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: ${{ inputs.paths }}

      - name: Get latest CI code from target
        if: steps.changes.outputs.ci != 'true' && github.base_ref
        env:
          REF: ${{ github.base_ref }}
          CI_DIR: ${{ inputs.ci-directory }}
        run: |
          echo "Using CI code from $REF"
          git fetch origin "$REF"
          git checkout origin/"$REF" -- "$CI_DIR" .golangci.yml Makefile

      - name: Setup Go
        if: steps.changes.outputs.files == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            ${{ inputs.ci-directory }}/go.sum

      - name: Check formatting
        if: steps.changes.outputs.files == 'true'
        run: make fmt-check

      - name: Run golangci-lint
        if: steps.changes.outputs.files == 'true'
        id: golangci_lint
        run: make lint

      - name: Report failure in PR comment
        if: failure() && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COMMENT_ID=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- workflow-id: golangci-lint -->")) | .id' \
            | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api --method DELETE "repos/$GH_REPO/issues/comments/$COMMENT_ID"
          fi
          gh pr comment "$PR_NUMBER" --body "golangci-lint failed. Please run \`make fmt\` and \`make lint\` locally, fix all the issues, and commit the changes. <!-- workflow-id: golangci-lint -->"

      - name: Remove failure comment on success
        if: success() && steps.changes.outputs.files == 'true' && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COMMENT_ID=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- workflow-id: golangci-lint -->")) | .id' \
            | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api --method DELETE "repos/$GH_REPO/issues/comments/$COMMENT_ID"
          fi
