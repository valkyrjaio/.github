name: Z Reusable Get Version For Release

on:
  workflow_call:
    inputs:
      bump:
        description: 'Version component to bump (major, minor, or patch)'
        type: string
        required: true
    outputs:
      version:
        description: 'The computed version without v prefix (e.g. 26.1.0)'
        value: ${{ jobs.get-version-for-release.outputs.version }}
      major-version:
        description: 'The major version number (e.g. 26)'
        value: ${{ jobs.get-version-for-release.outputs.major-version }}
      build-date:
        description: 'The build date in MST (e.g. April 16 2026 12:00:00 MST)'
        value: ${{ jobs.get-version-for-release.outputs.build-date }}

jobs:
  get-version-for-release:
    name: Compute Release Version

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.compute-version.outputs.version }}
      major-version: ${{ steps.compute-version.outputs.major-version }}
      build-date: ${{ steps.build-date.outputs.date }}

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Compute new version
        id: compute-version
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
          BRANCH: ${{ github.ref_name }}
          LATEST_MAJOR_VERSION: ${{ vars.LATEST_MAJOR_VERSION }}
        run: |
          # Release candidates must come from master and target the next unreleased major
          if [ "$BUMP" = "rc" ]; then
            if [ "$BRANCH" != "master" ]; then
              echo "Release candidates must be created from master. Current branch: $BRANCH"
              exit 1
            fi

            # Find the highest existing major version branch
            HIGHEST_MAJOR=$(gh api "repos/$GITHUB_REPOSITORY/branches" --paginate \
              --jq '.[].name' 2>/dev/null \
              | grep -E '^[0-9]+\.x$' \
              | sed 's/\.x//' \
              | sort -n \
              | tail -1 || echo "")

            if [ -z "$HIGHEST_MAJOR" ]; then
              echo "No version branches found. Cannot determine next major version for RC."
              exit 1
            fi

            NEXT_MAJOR=$((HIGHEST_MAJOR + 1))

            # Find the highest existing RC number for this next major
            LATEST_RC=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease == true) | .tagName' 2>/dev/null \
              | grep -E "^v${NEXT_MAJOR}\.0\.0-RC[0-9]+$" \
              | sed "s/^v${NEXT_MAJOR}\.0\.0-RC//" \
              | sort -n \
              | tail -1 || echo "0")

            NEXT_RC=$((LATEST_RC + 1))
            NEW_VERSION="${NEXT_MAJOR}.0.0-RC${NEXT_RC}"

            echo "Computed RC version: v$NEW_VERSION (based on highest version branch: ${HIGHEST_MAJOR}.x)"
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "major-version=$NEXT_MAJOR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Validate branch — all stable releases must come from a major version branch
          if [ "$BRANCH" = "master" ]; then
            echo "Stable releases cannot be triggered from master."
            echo "Create a version branch (e.g. 26.x) first, then release from it."
            echo "For a release candidate, use the 'rc' bump type."
            exit 1
          elif [[ "$BRANCH" =~ ^([0-9]+)\.x$ ]]; then
            BRANCH_MAJOR="${BASH_REMATCH[1]}"
          else
            echo "Releases must be triggered from a major version branch (e.g. 26.x)."
            exit 1
          fi

          # For a major bump, the version is always BRANCH_MAJOR.0.0
          if [ "$BUMP" = "major" ]; then
            echo "Major bump on $BRANCH: releasing v${BRANCH_MAJOR}.0.0"
            echo "version=${BRANCH_MAJOR}.0.0" >> "$GITHUB_OUTPUT"
            echo "major-version=${BRANCH_MAJOR}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For minor/patch: only look at this major's releases
          FILTER_PATTERN="^v${BRANCH_MAJOR}\.[0-9]+\.[0-9]+$"

          LATEST_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null \
            | grep -E "$FILTER_PATTERN" \
            | sort -V \
            | tail -1 \
            || echo "")

          if [ -z "$LATEST_TAG" ]; then
            echo "No existing releases found for v${BRANCH_MAJOR}.x. Forcing major bump to v${BRANCH_MAJOR}.0.0"
            echo "version=${BRANCH_MAJOR}.0.0" >> "$GITHUB_OUTPUT"
            echo "major-version=${BRANCH_MAJOR}" >> "$GITHUB_OUTPUT"
            exit 0
          else
            LATEST="${LATEST_TAG#v}"
            LATEST_MAJOR=$(echo "$LATEST" | cut -d. -f1)
            LATEST_MINOR=$(echo "$LATEST" | cut -d. -f2)
            LATEST_PATCH=$(echo "$LATEST" | cut -d. -f3)
            echo "Latest release: $LATEST_TAG"
          fi

          # Calculate new version
          case "$BUMP" in
            major)
              NEW_MAJOR=$((LATEST_MAJOR + 1))
              NEW_MINOR=0
              NEW_PATCH=0
              ;;
            minor)
              NEW_MAJOR="$LATEST_MAJOR"
              NEW_MINOR=$((LATEST_MINOR + 1))
              NEW_PATCH=0
              ;;
            patch)
              NEW_MAJOR="$LATEST_MAJOR"
              NEW_MINOR="$LATEST_MINOR"
              NEW_PATCH=$((LATEST_PATCH + 1))
              ;;
            *)
              echo "Invalid bump type: $BUMP. Must be major, minor, or patch."
              exit 1
              ;;
          esac

          NEW_VERSION="${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
          echo "Computed version: v$NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "major-version=$NEW_MAJOR" >> "$GITHUB_OUTPUT"

      - name: Validate computed version
        env:
          VERSION: ${{ steps.compute-version.outputs.version }}
          BUMP: ${{ inputs.bump }}
          SUPPORTED_VERSIONS: ${{ vars.SUPPORTED_VERSIONS }}
        run: |
          # RC versions have their own format; skip standard semver checks
          if [[ "$VERSION" =~ ^[0-9]+\.0\.0-RC[0-9]+$ ]]; then
            echo "RC version v$VERSION passed format check."
            exit 0
          fi

          # Verify semver format
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Computed version '$VERSION' is not valid semver. Aborting."
            exit 1
          fi

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          # Verify major version is supported
          if [ -z "$SUPPORTED_VERSIONS" ]; then
            echo "SUPPORTED_VERSIONS not set; skipping version support check."
          elif ! [[ "$MAJOR" =~ $SUPPORTED_VERSIONS ]]; then
            echo "Computed major version $MAJOR is not in the supported versions ($SUPPORTED_VERSIONS). Aborting."
            exit 1
          else
            echo "Major version $MAJOR matches supported versions ($SUPPORTED_VERSIONS)."
          fi

          # Verify the correct component is non-zero for the bump type
          case "$BUMP" in
            major)
              if [ "$MINOR" -ne 0 ] || [ "$PATCH" -ne 0 ]; then
                echo "Major bump should produce X.0.0 but got $VERSION. Aborting."
                exit 1
              fi
              ;;
            minor)
              if [ "$PATCH" -ne 0 ]; then
                echo "Minor bump should produce X.Y.0 but got $VERSION. Aborting."
                exit 1
              fi
              ;;
          esac

          echo "Version v$VERSION passed all sanity checks."

      - name: Check if version tag already exists
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          VERSION: v${{ steps.compute-version.outputs.version }}
        run: |
          if gh release view "$VERSION" --json tagName >/dev/null 2>&1; then
            echo "Version $VERSION already exists! Aborting."
            exit 1
          fi

          echo "Version $VERSION does not exist. Proceeding."

      - name: Get date for build
        id: build-date
        run: |
          # Convert timestamp to MST date in human-readable format
          FORMATED_DATE=$(TZ='America/Phoenix' date '+%B %-d %Y %T MST')

          # Make date available to other steps
          echo "date=$(echo $FORMATED_DATE)" >> $GITHUB_OUTPUT;
