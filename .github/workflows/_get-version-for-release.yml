name: Z Reusable Get Version For Release

on:
  workflow_call:
    inputs:
      bump:
        description: 'Version component to bump (auto, patch, feature, yearly, or rc)'
        type: string
        required: true
    outputs:
      version:
        description: 'The computed version without v prefix (e.g. 26.1.0)'
        value: ${{ jobs.get-version-for-release.outputs.version }}
      major-version:
        description: 'The major version number (e.g. 26)'
        value: ${{ jobs.get-version-for-release.outputs.major-version }}
      build-date:
        description: 'The build date in MST (e.g. April 16 2026 12:00:00 MST)'
        value: ${{ jobs.get-version-for-release.outputs.build-date }}
      should-release:
        description: 'Whether there is anything to release. "auto" sets this to false when nothing is pending; every explicit bump sets it to true.'
        value: ${{ jobs.get-version-for-release.outputs.should-release }}
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  get-version-for-release:
    name: Compute Release Version

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.compute-version.outputs.version }}
      major-version: ${{ steps.compute-version.outputs.major-version }}
      build-date: ${{ steps.build-date.outputs.date }}
      should-release: ${{ steps.compute-version.outputs.should-release }}

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Checkout the CI actions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: valkyrjaio/.github
          ref: ${{ job.workflow_sha }}
          path: dot-github

      - name: Compute new version
        id: compute-version
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
          BRANCH: ${{ github.ref_name }}
          SUPPORTED_VERSIONS: ${{ vars.SUPPORTED_VERSIONS }}
        run: dot-github/.github/ci/scripts/compute-release-version.sh

      # `run-script` carries the pinning proof. The compute step above writes step outputs, so the
      # constraint holds it to the direct form, and this step is where the job proves what it ran.
      # It proves that before anything is published.
      #
      # The environment is step-level rather than the action's `env:` input. That input appends to
      # `$GITHUB_ENV`, which reaches every later step of the job.
      - name: Validate computed version
        if: steps.compute-version.outputs.should-release == 'true'
        env:
          VERSION: ${{ steps.compute-version.outputs.version }}
          BUMP: ${{ inputs.bump }}
          SUPPORTED_VERSIONS: ${{ vars.SUPPORTED_VERSIONS }}
        uses: ./dot-github/.github/actions/run-script
        with:
          script: validate-release-version.sh
          expected-ref: ${{ job.workflow_sha }}

      - name: Check if version tag already exists
        if: steps.compute-version.outputs.should-release == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          VERSION: v${{ steps.compute-version.outputs.version }}
        run: |
          if gh release view "$VERSION" --json tagName >/dev/null 2>&1; then
            echo "Version $VERSION already exists! Aborting."
            exit 1
          fi

          echo "Version $VERSION does not exist. Proceeding."

      - name: Get date for build
        id: build-date
        run: |
          # Convert timestamp to MST date in human-readable format
          FORMATED_DATE=$(TZ='America/Phoenix' date '+%B %-d %Y %T MST')

          # Make date available to other steps
          echo "date=$(echo $FORMATED_DATE)" >> $GITHUB_OUTPUT;
