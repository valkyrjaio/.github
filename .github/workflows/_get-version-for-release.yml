name: Get Version For Release

on:
  workflow_call:
    inputs:
      bump:
        description: 'Version component to bump (major, minor, or patch)'
        type: string
        required: true
    outputs:
      version:
        description: 'The computed version without v prefix (e.g. 26.1.0)'
        value: ${{ jobs.get-version-for-release.outputs.version }}
      major-version:
        description: 'The major version number (e.g. 26)'
        value: ${{ jobs.get-version-for-release.outputs.major-version }}
      build-date:
        description: 'The build date in MST (e.g. April 16 2026 12:00:00 MST)'
        value: ${{ jobs.get-version-for-release.outputs.build-date }}

jobs:
  get-version-for-release:
    name: Compute Release Version

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.compute-version.outputs.version }}
      major-version: ${{ steps.compute-version.outputs.major-version }}
      build-date: ${{ steps.build-date.outputs.date }}

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Compute new version
        id: compute-version
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
          BRANCH: ${{ github.ref_name }}
          LATEST_MAJOR_VERSION: ${{ vars.LATEST_MAJOR_VERSION }}
        run: |
          # Validate branch and bump combination
          if [ "$BRANCH" = "master" ]; then
            IS_MASTER=true
          elif [[ "$BRANCH" =~ ^([0-9]+)\.x$ ]]; then
            IS_MASTER=false
            BRANCH_MAJOR="${BASH_REMATCH[1]}"

            if [ "$BUMP" = "major" ]; then
              echo "Major version bumps must be released from master, not from a feature branch."
              exit 1
            fi
          else
            echo "Releases must be triggered from master or a major version branch (e.g. 26.x)."
            exit 1
          fi

          # Determine which releases to look at
          if [ "$IS_MASTER" = "true" ]; then
            # On master: compare against the globally highest release
            FILTER_PATTERN="^v[0-9]+\.[0-9]+\.[0-9]+$"
          else
            # On a feature branch: only look at this major's releases
            FILTER_PATTERN="^v${BRANCH_MAJOR}\.[0-9]+\.[0-9]+$"
          fi

          LATEST_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null \
            | grep -E "$FILTER_PATTERN" \
            | sort -V \
            | tail -1 \
            || echo "")

          if [ -z "$LATEST_TAG" ]; then
            YEAR=$(date +%Y)
            YEAR_SHORT="${YEAR:2}"

            if [ "$BUMP" = "major" ]; then
              # Seed one below current year so incrementing yields current year (e.g. 2026 → 26.0.0)
              LATEST_MAJOR=$((YEAR_SHORT - 1))
            else
              LATEST_MAJOR="$YEAR_SHORT"
              LATEST_MINOR=0
              LATEST_PATCH=0
            fi

            echo "No existing releases found. Seeding base version from current year: ${YEAR_SHORT}"
          else
            LATEST="${LATEST_TAG#v}"
            LATEST_MAJOR=$(echo "$LATEST" | cut -d. -f1)
            LATEST_MINOR=$(echo "$LATEST" | cut -d. -f2)
            LATEST_PATCH=$(echo "$LATEST" | cut -d. -f3)
            echo "Latest release: $LATEST_TAG"
          fi

          # Calculate new version
          case "$BUMP" in
            major)
              NEW_MAJOR=$((LATEST_MAJOR + 1))
              NEW_MINOR=0
              NEW_PATCH=0
              ;;
            minor)
              NEW_MAJOR="$LATEST_MAJOR"
              NEW_MINOR=$((LATEST_MINOR + 1))
              NEW_PATCH=0
              ;;
            patch)
              NEW_MAJOR="$LATEST_MAJOR"
              NEW_MINOR="$LATEST_MINOR"
              NEW_PATCH=$((LATEST_PATCH + 1))
              ;;
            *)
              echo "Invalid bump type: $BUMP. Must be major, minor, or patch."
              exit 1
              ;;
          esac

          NEW_VERSION="${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
          echo "Computed version: v$NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "major-version=$NEW_MAJOR" >> "$GITHUB_OUTPUT"

      - name: Validate computed version
        env:
          VERSION: ${{ steps.compute-version.outputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          # Verify semver format
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Computed version '$VERSION' is not valid semver. Aborting."
            exit 1
          fi

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          # Verify major is within one year of current year
          YEAR=$(date +%Y)
          YEAR_SHORT="${YEAR:2}"
          MIN_MAJOR=$((YEAR_SHORT - 1))
          MAX_MAJOR=$((YEAR_SHORT + 1))

          if [ "$MAJOR" -lt "$MIN_MAJOR" ] || [ "$MAJOR" -gt "$MAX_MAJOR" ]; then
            echo "Computed major version $MAJOR is outside the expected range ($MIN_MAJOR–$MAX_MAJOR). Aborting."
            exit 1
          fi

          # Verify the correct component is non-zero for the bump type
          case "$BUMP" in
            major)
              if [ "$MINOR" -ne 0 ] || [ "$PATCH" -ne 0 ]; then
                echo "Major bump should produce X.0.0 but got $VERSION. Aborting."
                exit 1
              fi
              ;;
            minor)
              if [ "$PATCH" -ne 0 ]; then
                echo "Minor bump should produce X.Y.0 but got $VERSION. Aborting."
                exit 1
              fi
              ;;
          esac

          echo "Version v$VERSION passed all sanity checks."

      - name: Check if version tag already exists
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          VERSION: v${{ steps.compute-version.outputs.version }}
        run: |
          if gh release view "$VERSION" --json tagName >/dev/null 2>&1; then
            echo "Version $VERSION already exists! Aborting."
            exit 1
          fi

          echo "Version $VERSION does not exist. Proceeding."

      - name: Get date for build
        id: build-date
        run: |
          # Convert timestamp to MST date in human-readable format
          FORMATED_DATE=$(TZ='America/Phoenix' date '+%B %-d %Y %T MST')

          # Make date available to other steps
          echo "date=$(echo $FORMATED_DATE)" >> $GITHUB_OUTPUT;
