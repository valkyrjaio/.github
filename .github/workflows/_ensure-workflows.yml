name: Z Reusable Ensure Required Workflows

on:
  workflow_call:
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  ensure-workflows:
    name: Ensure Required Workflows

    runs-on: ubuntu-latest

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # This checkout carries both halves of the step below: the templates it copies, under
      # `dot-github/required-workflows`, and the script that copies them. The step keeps the
      # workspace root as its working directory, so each path the script reads stays relative
      # to that root rather than to the script.
      - name: Checkout .github for the workflow templates and the script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: dot-github

      - name: Ensure required workflows across all repositories
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          SUPPORTED_VERSIONS: ${{ vars.SUPPORTED_VERSIONS }}
        run: dot-github/.github/ci/scripts/ensure-workflows.sh
