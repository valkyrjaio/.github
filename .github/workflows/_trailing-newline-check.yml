name: Z Reusable Trailing Newline Check

on:
  workflow_call:
    inputs:
      post-pr-comment:
        description: 'Whether to post a PR comment on failure (and delete it on success)'
        type: boolean
        default: true
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  trailing-newline-check:
    name: Check Trailing Newline

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Generate a token
        id: generate-token
        if: github.event.pull_request.number && inputs.post-pr-comment
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Simulated infrastructure failure
        run: exit 1

      - name: Check for trailing newlines
        id: check
        run: |
          mapfile -d '' files < <(git ls-files -z)

          missing=()
          for file in "${files[@]}"; do
            [ -d "$file" ] && continue
            [ ! -s "$file" ] && continue
            if file --mime-encoding "$file" 2>/dev/null | grep -q 'binary'; then
              continue
            fi
            if [ "$(tail -c 1 "$file" | wc -l)" -eq 0 ]; then
              missing+=("$file")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "The following files are missing a trailing newline:"
            printf '  %s\n' "${missing[@]}"
            {
              echo 'missing_files<<EOF'
              printf '%s\n' "${missing[@]}"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "All files have a trailing newline."

      # The gate is the check step's own output, never `failure()`. `failure()` is true for any
      # failed step, so a broken `actions/checkout` posted a comment that named no file and told the
      # developer to add a newline. That advice does not help, because no file is missing one. The
      # output is set only where the check names a file, so it is evidence that the check itself
      # found a problem. `!cancelled()` is required: a step whose `if:` holds no status check
      # function gets `success() &&` prepended, and the job status is already `failure` here.
      - name: Report failure in PR comment
        if: failure() && github.event.pull_request.number && inputs.post-pr-comment
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MISSING_FILES: ${{ steps.check.outputs.missing_files }}
        run: |
          # Delete every marked comment, not the first. Two concurrent runs can race on a rapid
          # double push and leave two marked comments, and a `head -1` left one of them behind
          # forever. `--paginate` reaches a marked comment after the first page of 30.
          COMMENT_IDS=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- workflow-id: trailing-newline-check -->")) | .id')
          for COMMENT_ID in $COMMENT_IDS; do
            gh api --method DELETE "repos/$GH_REPO/issues/comments/$COMMENT_ID"
          done
          BODY="The following files are missing a trailing newline:"$'\n\n'
          while IFS= read -r f; do
            [ -n "$f" ] && BODY+="- \`$f\`"$'\n'
          done <<< "$MISSING_FILES"
          BODY+=$'\n<!-- workflow-id: trailing-newline-check -->'
          gh pr comment "$PR_NUMBER" --body "$BODY"

      - name: Remove failure comment on success
        if: success() && github.event.pull_request.number && inputs.post-pr-comment
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COMMENT_IDS=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- workflow-id: trailing-newline-check -->")) | .id')
          for COMMENT_ID in $COMMENT_IDS; do
            gh api --method DELETE "repos/$GH_REPO/issues/comments/$COMMENT_ID"
          done
