name: Z Reusable Trailing Newline Check

# Every text file a repository tracks ends with a newline.
#
# The work is not here. `_run-script.yml` runs the script and reports what it wrote, and
# `_post-comment.yml` keeps that report on the pull request. This workflow names the check and
# wires the two together, so a correction to either building block reaches every check at once.

on:
  workflow_call:
    inputs:
      post-pr-comment:
        description: 'Whether to post a PR comment on failure (and delete it on success)'
        type: boolean
        default: true
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  check:
    name: Check Trailing Newline
    # A relative path resolves to the same commit as this workflow, so the script this runs can
    # never drift from the workflow that runs it, and no reference needs a bump.
    uses: ./.github/workflows/_run-script.yml
    with:
      script: trailing-newline-check.sh

  # `always()` runs this after a passing check as well as a failing one. A passing check posts no
  # body, which removes the report an earlier run left behind.
  #
  # The body is the script's own output, and it is empty unless the script reported a failure. A
  # job that fails before the script runs sets no output, so an infrastructure fault cannot post a
  # report that names no file.
  comment:
    name: Report
    needs: check
    if: always() && inputs.post-pr-comment && github.event.pull_request.number
    uses: ./.github/workflows/_post-comment.yml
    with:
      marker: trailing-newline-check
      body: ${{ needs.check.outputs.outcome == 'failure' && needs.check.outputs.report || '' }}
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
