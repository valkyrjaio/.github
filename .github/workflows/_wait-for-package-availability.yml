name: Z Reusable Wait For Package Availability

on:
  workflow_call:
    inputs:
      ecosystem:
        description: 'Registry to poll (maven, npm, packagist, pypi)'
        type: string
        required: true
      wait-minutes:
        description: 'How long to wait for the registry to serve the released version'
        type: number
        default: 30
      skip-when-unknown:
        description: 'End the wait when the registry does not know the package. Only for a caller that also runs in repositories which do not publish.'
        type: boolean
        default: false

jobs:
  wait-for-availability:
    name: Wait For Package Availability

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref_name }}

      # The step below runs a script from this repository, and the checkout above holds the calling
      # repository instead. An action cannot fetch the files it is made of, and neither can a
      # workflow, so this repository is checked out separately at the commit the caller pinned.
      # `job.workflow_sha` is what keeps the script and the workflow on one commit.
      - name: Checkout the CI scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: valkyrjaio/.github
          ref: ${{ job.workflow_sha }}
          path: dot-github

      - name: Wait for the registry to serve the released version
        env:
          ECOSYSTEM: ${{ inputs.ecosystem }}
          WAIT_MINUTES: ${{ inputs.wait-minutes }}
          SKIP_WHEN_UNKNOWN: ${{ inputs.skip-when-unknown }}
        run: dot-github/.github/ci/scripts/wait-for-package-availability.sh
