name: Reusable Update .github Workflow References

on:
  workflow_call:

jobs:
  update-refs:
    name: Update .github Workflow References

    runs-on: ubuntu-latest

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Update workflow refs across all repositories
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          REVIEWER: ${{ vars.VALKYRJA_REVIEWER }}
          SUPPORTED_VERSIONS: ${{ vars.SUPPORTED_VERSIONS }}
        run: |
          LATEST_TAG=$(gh api "repos/$ORG/.github/releases/latest" --jq '.tag_name')
          LATEST_SHA=$(gh api "repos/$ORG/.github/commits/$LATEST_TAG" --jq '.sha')
          echo "Latest .github release: $LATEST_TAG ($LATEST_SHA)"

          REPOS=$(gh repo list "$ORG" --limit 200 --json name,isArchived \
            --jq '.[] | select(.isArchived == false) | .name')

          while IFS= read -r REPO_NAME; do
            echo "Checking $ORG/$REPO_NAME..."

            if [ "$REPO_NAME" = ".github" ]; then
              WORKFLOW_FILES=$(gh api "repos/$ORG/$REPO_NAME/git/trees/HEAD?recursive=1" \
                --jq '.tree[] | select(.type == "blob" and (.path | startswith("required-workflows/"))) | .path' \
                2>/dev/null || true)
            else
              WORKFLOW_FILES=$(gh api "repos/$ORG/$REPO_NAME/contents/.github/workflows" \
                --jq '.[].path' 2>/dev/null || true)
            fi

            [ -z "$WORKFLOW_FILES" ] && continue

            # Collect base branches: master + supported ?.x branches that exist
            ALL_BRANCHES=$(gh api "repos/$ORG/$REPO_NAME/branches" --paginate \
              --jq '.[].name' 2>/dev/null || true)

            # Collect supported version branches; fall back to master if none exist
            BASE_BRANCHES=""
            while IFS= read -r b; do
              if [[ "$b" =~ ^([0-9]+)\.x$ ]]; then
                MAJOR="${BASH_REMATCH[1]}"
                if [ -n "$SUPPORTED_VERSIONS" ] && [[ "$MAJOR" =~ $SUPPORTED_VERSIONS ]]; then
                  BASE_BRANCHES="$BASE_BRANCHES"$'\n'"$b"
                fi
              fi
            done <<< "$ALL_BRANCHES"

            if [ -z "$BASE_BRANCHES" ]; then
              BASE_BRANCHES="master"
            fi

            while IFS= read -r BASE_BRANCH; do
              [ -z "$BASE_BRANCH" ] && continue

              if [ "$BASE_BRANCH" = "master" ]; then
                UPDATE_BRANCH="deps/update-github-workflow-refs"
              else
                UPDATE_BRANCH="deps/update-github-workflow-refs-$BASE_BRANCH"
              fi

              BRANCH_EXISTS=$(gh api "repos/$ORG/$REPO_NAME/git/refs/heads/$UPDATE_BRANCH" \
                --jq '.object.sha' 2>/dev/null) || BRANCH_EXISTS=""

              FILES_UPDATED=0
              FILES_LIST=""

              while IFS= read -r FILE_PATH; do
                FILE_DATA=$(gh api "repos/$ORG/$REPO_NAME/contents/$FILE_PATH?ref=$BASE_BRANCH" \
                  2>/dev/null || true)
                [ -z "$FILE_DATA" ] && continue

                FILE_SHA=$(echo "$FILE_DATA" | jq -r '.sha')
                CONTENT=$(echo "$FILE_DATA" | jq -r '.content' | base64 -d)

                if ! echo "$CONTENT" | grep -q "valkyrjaio/\.github/\.github/workflows/"; then
                  continue
                fi

                NEW_CONTENT=$(echo "$CONTENT" | sed "s|valkyrjaio/\.github/\.github/workflows/\([^@]*\)@[^[:space:]]*|valkyrjaio/.github/.github/workflows/\1@$LATEST_SHA|g")

                if [ "$CONTENT" = "$NEW_CONTENT" ]; then
                  echo "  [$BASE_BRANCH] $FILE_PATH: already up to date"
                  continue
                fi

                echo "  [$BASE_BRANCH] $FILE_PATH: updating to $LATEST_TAG"

                if [ -z "$BRANCH_EXISTS" ]; then
                  echo "  [$BASE_BRANCH] Creating branch $UPDATE_BRANCH..."

                  BASE_SHA=$(gh api "repos/$ORG/$REPO_NAME/git/refs/heads/$BASE_BRANCH" \
                    --jq '.object.sha' 2>/dev/null || true)
                  if [ -z "$BASE_SHA" ]; then
                    echo "  [$BASE_BRANCH] Could not get base branch SHA, skipping"
                    break
                  fi
                  BRANCH_CREATE_ERR=$(gh api --method POST "repos/$ORG/$REPO_NAME/git/refs" \
                    --field "ref=refs/heads/$UPDATE_BRANCH" \
                    --field "sha=$BASE_SHA" 2>&1 >/dev/null || true)
                  if [ -n "$BRANCH_CREATE_ERR" ]; then
                    echo "  [$BASE_BRANCH] Branch creation failed: $BRANCH_CREATE_ERR"
                    break
                  fi
                  echo "  [$BASE_BRANCH] Branch $UPDATE_BRANCH created."
                  BRANCH_EXISTS="$BASE_SHA"
                fi

                echo "  [$BASE_BRANCH] Committing $FILE_PATH to $UPDATE_BRANCH..."

                NEW_CONTENT_B64=$(printf '%s' "$NEW_CONTENT" | base64 | tr -d '\n')

                PUT_BODY=$(jq -cn \
                  --arg message "[GitHub] Update .github workflow refs to $LATEST_TAG." \
                  --arg content "$NEW_CONTENT_B64" \
                  --arg sha "$FILE_SHA" \
                  --arg branch "$UPDATE_BRANCH" \
                  '{message: $message, content: $content, sha: $sha, branch: $branch}')

                COMMIT_ERR=$(echo "$PUT_BODY" | gh api --method PUT "repos/$ORG/$REPO_NAME/contents/$FILE_PATH" \
                  --input - 2>&1 >/dev/null || true)
                if [ -n "$COMMIT_ERR" ]; then
                  echo "  [$BASE_BRANCH] $FILE_PATH commit failed: $COMMIT_ERR"
                  continue
                fi

                echo "  [$BASE_BRANCH] $FILE_PATH committed."

                FILES_LIST+="$FILE_PATH"$'\n'
                FILES_UPDATED=$((FILES_UPDATED + 1))
              done <<< "$WORKFLOW_FILES"

              if [ "$FILES_UPDATED" -gt 0 ]; then
                echo "  [$BASE_BRANCH] $FILES_UPDATED file(s) updated — checking for existing PR..."

                EXISTING_PR=$(gh pr list --repo "$ORG/$REPO_NAME" \
                  --state open \
                  --json headRefName \
                  --jq "[.[] | select(.headRefName == \"$UPDATE_BRANCH\")] | first | .headRefName // \"\"" \
                  2>/dev/null || true)

                if [ -z "$EXISTING_PR" ]; then
                  REVIEWER_FLAGS=""
                  if [ -n "$REVIEWER" ]; then
                    REVIEWER_FLAGS="--assignee $REVIEWER --reviewer $REVIEWER"
                  fi

                  BODY=""
                  BODY+="# Description"$'\n'$'\n'
                  BODY+="Update reusable workflow references from \`valkyrjaio/.github\` to release \`$LATEST_TAG\`."$'\n'$'\n'
                  BODY+="## Types of changes"$'\n'$'\n'
                  BODY+="- [X] Improvement _(non-breaking change which improves code)_"$'\n'
                  BODY+="- [ ] Bug fix _(non-breaking change which fixes an issue)_"$'\n'
                  BODY+="- [ ] New feature _(non-breaking change which adds functionality)_"$'\n'
                  BODY+="- [ ] Deprecation _(breaking change which removes functionality)_"$'\n'
                  BODY+="- [ ] Breaking change _(fix or feature that would cause existing functionality to change)_"$'\n'
                  BODY+="- [ ] Documentation improvement"$'\n'$'\n'
                  BODY+="## Changes"$'\n'$'\n'
                  BODY+="| File | Updated To |"$'\n'
                  BODY+="|------|------------|"$'\n'
                  while IFS= read -r file; do
                    [ -z "$file" ] && continue
                    BODY+="| \`$file\` | \`$LATEST_TAG\` |"$'\n'
                  done <<< "$FILES_LIST"

                  echo "  [$BASE_BRANCH] Creating PR from $UPDATE_BRANCH → $BASE_BRANCH..."

                  if ! gh pr create \
                    --repo "$ORG/$REPO_NAME" \
                    --title "[GitHub] Update .github workflow refs to $LATEST_TAG" \
                    --body "$BODY" \
                    --base "$BASE_BRANCH" \
                    --head "$UPDATE_BRANCH" \
                    $REVIEWER_FLAGS 2>/dev/null; then
                    echo "  [$BASE_BRANCH] PR creation failed, skipping"
                  else
                    echo "  [$BASE_BRANCH] PR created."
                  fi
                else
                  echo "  [$BASE_BRANCH] PR already exists, skipping."
                fi
              fi
            done <<< "$BASE_BRANCHES"
          done <<< "$REPOS"
