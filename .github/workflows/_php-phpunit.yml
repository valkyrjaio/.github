name: Z Reusable PHP PHPUnit

on:
  workflow_call:
    inputs:
      post-pr-comment:
        description: 'Whether to post a PR comment on failure (and delete it on success)'
        type: boolean
        default: true
      composer-options:
        description: 'Additional options to pass to all Composer install steps (e.g. --ignore-platform-req=ext-openswoole)'
        type: string
        default: ''
      php-versions:
        description: 'JSON array of PHP versions to test against'
        type: string
        default: '["8.4"]'
      php-version-bleeding-edge:
        description: 'PHP version treated as bleeding edge (continue-on-error, --ignore-platform-req=php+). Leave empty to disable.'
        type: string
        default: ''
      ci-directory:
        description: 'Path to the CI directory (containing composer.json and the phpunit config)'
        type: string
        default: '.github/ci/phpunit'
      additional-directory:
        description: 'Path to an additional Composer dependencies directory (optional). Leave empty to skip.'
        type: string
        default: ''
      extensions:
        description: 'PHP extensions to install'
        type: string
        default: 'mbstring, intl'
      coverage-php-version:
        description: 'PHP version that runs with coverage (all others run plain phpunit)'
        type: string
        default: '8.4'
      coverage-floor:
        description: >
          Minimum line coverage percentage the coverage run must reach, as a whole number. The
          check reads the clover report the coverage run writes. Set it to 0 to report the number
          and gate nothing.
        type: number
        default: 100
      source-paths:
        description: >
          The repository's own source globs, one per line and unquoted — for example
          `src/**/*.php`. The filter spec is derived from these plus the CI directory, so a caller
          declares its sources once. Ignored when `paths` is given.
        type: string
        default: ''
      paths:
        description: >
          YAML filter spec for dorny/paths-filter.
          Must define two keys: "ci" (the CI config files) and "files" (all files that should
          trigger the check). The "ci" key controls whether the base-branch CI directory is
          fetched; "files" controls whether the expensive steps run at all.
        type: string
        default: ''
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ${{ fromJson(inputs.php-versions) }}

    continue-on-error: ${{ inputs.php-version-bleeding-edge != '' && matrix.php == inputs.php-version-bleeding-edge }}

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Validate inputs
        env:
          PATHS: ${{ inputs.paths }}
          SOURCE_PATHS: ${{ inputs.source-paths }}
        run: |
          if [ -z "$PATHS" ] && [ -z "$SOURCE_PATHS" ]; then
            echo 'One of `paths` or `source-paths` is required.'
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Checkout the CI actions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: valkyrjaio/.github
          ref: ${{ job.workflow_sha }}
          path: dot-github

      - name: Derive the path filters
        id: filters
        if: inputs.paths == ''
        env:
          CI_DIR: ${{ inputs.ci-directory }}
          ADDITIONAL_DIR: ${{ inputs.additional-directory }}
          SOURCE_PATHS: ${{ inputs.source-paths }}
        run: |
          # Both keys share the CI config that decides this tool's behavior; `files` adds the
          # repository's own sources on top. `ci` controls whether the base-branch CI directory is
          # restored, `files` whether the expensive steps run at all.
          CONFIG=$(
            printf "  - '%s/**'\n" "$CI_DIR"
            if [ -n "$ADDITIONAL_DIR" ]; then
              printf "  - '%s/**'\n" "$ADDITIONAL_DIR"
            fi
            printf "  - '.github/workflows/ci.yml'\n"
          )

          {
            echo 'spec<<PATH_FILTERS_EOF'
            echo 'ci:'
            printf '%s\n' "$CONFIG"
            echo 'files:'
            printf '%s\n' "$CONFIG"
            printf '%s\n' "$SOURCE_PATHS" | while IFS= read -r glob; do
              glob=$(printf '%s' "$glob" | tr -d "\"' " )
              # `&& printf` would make an empty line the last command and, under `bash -e`,
              # fail the step. `source-paths` is a block scalar so it always ends in one.
              if [ -n "$glob" ]; then
                printf "  - '%s'\n" "$glob"
              fi
            done
            echo 'PATH_FILTERS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Determine if workflow should run based on files changed
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: ${{ inputs.paths != '' && inputs.paths || steps.filters.outputs.spec }}

      - name: Get latest CI code from target
        if: steps.changes.outputs.ci != 'true' && github.base_ref
        env:
          REF: ${{ github.base_ref }}
        run: |
          echo "Using CI code from $REF"
          git fetch origin "$REF"
          git checkout origin/"$REF" -- ${{ inputs.ci-directory }}

      - name: Get latest additional CI code from target
        if: inputs.additional-directory != '' && steps.changes.outputs.ci != 'true' && github.base_ref
        env:
          REF: ${{ github.base_ref }}
        run: |
          git checkout origin/"$REF" -- ${{ inputs.additional-directory }}

      - name: Setup PHP
        if: steps.changes.outputs.files == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ inputs.extensions }}
          ini-values: zend.assertions=1

      - name: Install Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: ${{ (inputs.php-version-bleeding-edge != '' && matrix.php == inputs.php-version-bleeding-edge) && '--ignore-platform-req=php+' || '' }} ${{ inputs.composer-options }} --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")

      - name: Install PHPUnit Composer dependencies
        if: steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: ${{ (inputs.php-version-bleeding-edge != '' && matrix.php == inputs.php-version-bleeding-edge) && '--ignore-platform-req=php+' || '' }} ${{ inputs.composer-options }} --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")
          working-directory: ${{ inputs.ci-directory }}

      - name: Install Additional Composer dependencies
        if: inputs.additional-directory != '' && steps.changes.outputs.files == 'true'
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3.2.1
        with:
          composer-options: ${{ (inputs.php-version-bleeding-edge != '' && matrix.php == inputs.php-version-bleeding-edge) && '--ignore-platform-req=php+' || '' }} ${{ inputs.composer-options }} --prefer-dist --no-progress
          custom-cache-suffix: $(date -u "+%Y-%m")
          working-directory: ${{ inputs.additional-directory }}

      - name: Make build logs dir
        if: steps.changes.outputs.files == 'true'
        run: mkdir -p ${{ inputs.ci-directory }}/build/logs

      - name: Run PHPUnit tests
        if: matrix.php != inputs.coverage-php-version && steps.changes.outputs.files == 'true'
        id: phpunit
        run: composer phpunit

      - name: Run PHPUnit tests with full coverage
        if: matrix.php == inputs.coverage-php-version && steps.changes.outputs.files == 'true'
        id: phpunit-coverage
        run: composer phpunit-coverage

      - name: Upload Coveralls coverage report
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        if: matrix.php == inputs.coverage-php-version && steps.changes.outputs.files == 'true'
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: "${{ inputs.ci-directory }}/build/logs/clover.xml"
          format: "clover"

      # Only the coverage leg of the matrix writes a report, so only that leg can read one. A
      # floor of 0 reports the number and gates nothing, which is how a repository opts out.
      #
      # `continue-on-error` keeps a failing check from ending the job here, so the report reaches
      # the comment below. The last step decides the result of the job.
      - name: Check the coverage floor
        id: coverage-floor
        if: >-
          matrix.php == inputs.coverage-php-version &&
          steps.changes.outputs.files == 'true' &&
          inputs.coverage-floor > 0
        continue-on-error: true
        uses: ./dot-github/.github/actions/run-script
        with:
          script: coverage-floor-check.sh
          expected-ref: ${{ job.workflow_sha }}
          env: |
            CLOVER_PATH=${{ inputs.ci-directory }}/build/logs/clover.xml
            REQUIRE_LINE=${{ inputs.coverage-floor }}

      # The script writes its own remediation text, so the report is posted as it stands.
      #
      # Warning: `!cancelled()` rather than `always()`. A cancelled run has no outcome, so the body
      # would be empty and the report of the run before it would be removed while it still held.
      - name: Report the coverage floor on the pull request
        if: ${{ !cancelled() && matrix.php == inputs.coverage-php-version && steps.changes.outputs.files == 'true' && github.event.pull_request.number && inputs.post-pr-comment }}
        uses: ./dot-github/.github/actions/post-comment
        with:
          marker: coverage-floor-check
          body: ${{ steps.coverage-floor.outcome == 'failure' && steps.coverage-floor.outputs.report-markdown || '' }}
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      # A skipped check has an empty outcome, and an empty outcome is not a failure. Only the value
      # `failure` fails the job, so a matrix leg that measured no coverage still passes.
      - name: Fail when the coverage floor was not met
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.coverage-floor.outcome }}
        run: |
          if [[ "$OUTCOME" == 'failure' ]]; then
            echo 'Line coverage is below the floor. The report is above, and on the pull request.'
            exit 1
          fi

      # The gate is the PHPUnit step's own outcome, never `failure()`. `failure()` is true for any
      # failed step, so a broken checkout, a failed dependency install, or a failed token mint
      # posted a comment that told the developer to run PHPUnit locally. That advice does not help,
      # because PHPUnit never reported a problem. `!cancelled()` is required: a step whose `if:`
      # holds no status check function gets `success() &&` prepended, and the job status is already
      # `failure` here.
      # The `post-comment` action keeps one comment per marker: it removes every stale one, and it
      # posts a new one only when given a body. A passing run gives none, which clears the report an
      # earlier run left behind.
      #
      # Warning: `!cancelled()` rather than `always()`. A cancelled run has no outcome, so the body
      # would be empty and the report of the run before it would be removed while it still held.
      - name: Report the result on the pull request
        if: ${{ !cancelled() && steps.changes.outputs.files == 'true' && github.event.pull_request.number && inputs.post-pr-comment }}
        uses: ./dot-github/.github/actions/post-comment
        with:
          marker: phpunit-${{ matrix.php }}
          body: ${{ (steps.phpunit.outcome == 'failure' || steps.phpunit-coverage.outcome == 'failure') && format('PHPUnit failed for PHP {0}. Please run `composer phpunit` locally, fix all the issues, and commit the changes.', matrix.php) || '' }}
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
