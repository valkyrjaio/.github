name: Reusable Restore Branch From Backup

on:
  workflow_call:

jobs:
  restore:
    name: "Restore ${{ github.ref_name }} from ${{ github.ref_name }}-backup"

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ steps.generate-token.outputs.token }}

      - name: Restore ${{ github.ref_name }} from ${{ github.ref_name }}-backup
        run: |
          git fetch origin "${{ github.ref_name }}-backup"
          git push --force-with-lease origin "origin/${{ github.ref_name }}-backup:refs/heads/${{ github.ref_name }}"
