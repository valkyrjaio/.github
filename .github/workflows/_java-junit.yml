name: Z Reusable Java JUnit

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to use'
        type: string
        default: '21'
      ci-directory:
        description: 'Path to the CI directory (e.g. .github/ci/junit)'
        type: string
        required: true
      source-paths:
        description: >
          The repository's own source globs, one per line and unquoted. The filter spec is derived
          from these plus the CI directory, so a caller declares its sources once. Ignored when
          `paths` is given.
        type: string
        default: ''
      paths:
        description: 'Path filters in dorny/paths-filter format (must define ci and files keys)'
        type: string
        default: ''
      copy-example-sources:
        description: 'Copy *.example.java templates to their .java target (when missing) before building'
        type: boolean
        default: false
        required: false
      upload-coverage:
        description: 'Upload the JaCoCo report to Coveralls. Turn off for a job whose report does not describe the repo''s test coverage (e.g. one that compiles the whole app but only asserts generated code)'
        type: boolean
        default: true
        required: false
    secrets:
      VALKYRJA_GHA_APP_ID:
        description: 'App ID of the GitHub App that mints the token this workflow uses'
        required: true
      VALKYRJA_GHA_PRIVATE_KEY:
        description: 'Private key of the GitHub App that mints the token this workflow uses'
        required: true

jobs:
  junit:
    name: JUnit

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Validate inputs
        env:
          PATHS: ${{ inputs.paths }}
          SOURCE_PATHS: ${{ inputs.source-paths }}
        run: |
          if [ -z "$PATHS" ] && [ -z "$SOURCE_PATHS" ]; then
            echo 'One of `paths` or `source-paths` is required.'
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Generate a token
        id: generate-token
        if: github.event.pull_request.number
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Derive the path filters
        id: filters
        if: inputs.paths == ''
        env:
          CI_DIR: ${{ inputs.ci-directory }}
          SOURCE_PATHS: ${{ inputs.source-paths }}
        run: |
          # Both keys share the CI config that decides this tool's behavior; `files` adds the
          # repository's own sources on top. `ci` controls whether the base-branch CI directory is
          # restored, `files` whether the expensive steps run at all.
          CONFIG=$(
            printf "  - '%s/**'\n" "$CI_DIR"
            printf "  - '.github/workflows/ci.yml'\n"
          )

          {
            echo 'spec<<PATH_FILTERS_EOF'
            echo 'ci:'
            printf '%s\n' "$CONFIG"
            echo 'files:'
            printf '%s\n' "$CONFIG"
            printf '%s\n' "$SOURCE_PATHS" | while IFS= read -r glob; do
              glob=$(printf '%s' "$glob" | tr -d "\"' " )
              # `&& printf` would make an empty line the last command and, under `bash -e`,
              # fail the step. `source-paths` is a block scalar so it always ends in one.
              if [ -n "$glob" ]; then
                printf "  - '%s'\n" "$glob"
              fi
            done
            echo 'PATH_FILTERS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Determine if workflow should run based on files changed
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: ${{ inputs.paths != '' && inputs.paths || steps.filters.outputs.spec }}

      - name: Get latest CI code from target
        if: steps.changes.outputs.ci != 'true' && github.base_ref
        env:
          REF: ${{ github.base_ref }}
          CI_DIR: ${{ inputs.ci-directory }}
        run: |
          echo "Using CI code from $REF"
          git fetch origin "$REF"
          git checkout origin/"$REF" -- "$CI_DIR"

      - name: Setup Java
        if: steps.changes.outputs.files == 'true'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.changes.outputs.files == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Copy example sources
        if: steps.changes.outputs.files == 'true' && inputs.copy-example-sources
        run: |
          find . -name '*.example.java' | while read -r f; do
            target="${f%.example.java}.java"
            [ -e "$target" ] || cp "$f" "$target"
          done

      - name: Run JUnit
        if: steps.changes.outputs.files == 'true'
        id: build_step
        working-directory: ${{ inputs.ci-directory }}
        run: gradle test

      - name: Upload Coveralls coverage report
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        if: steps.changes.outputs.files == 'true' && inputs.upload-coverage
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: "${{ inputs.ci-directory }}/build/reports/jacoco/test/jacocoTestReport.xml"
          format: jacoco
          base-path: src/main/java

      - name: Report failure in PR comment
        if: steps.build_step.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$PR_URL" ]; then
            echo "Not a pull request, skipping comment."
            exit 0
          fi

          gh pr comment "$PR_URL" --body "JUnit tests failed. Please fix the failing tests locally and commit the changes."
