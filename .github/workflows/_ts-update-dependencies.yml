name: Z Reusable TypeScript Update Dependencies

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        type: string
        default: '22'
      dependencies:
        description: >
          JSON array of dependencies to update.
          Each item must have a "name" (display name) and "directory" (path to the package.json directory).
          Example: [{"name":"Vitest CI","directory":".github/ci/vitest"}]
        type: string
        required: true

jobs:
  update-ts-dependencies:
    name: Update TypeScript Dependencies

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Get bot user ID
        id: get-bot-user-id
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}
        run: |
          BOT_USER_ID=$(gh api "/users/$APP_SLUG[bot]" --jq '.id')
          echo "user-id=$BOT_USER_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Checkout existing PR branch if present
        id: prep-branch
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BASE: ${{ github.ref_name }}
        run: |
          EXISTING=$(gh pr list \
            --base "$BASE" \
            --state open \
            --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("deps/update-dependencies-"))] | first | .headRefName // ""')

          if [ -n "$EXISTING" ]; then
            echo "Found existing PR branch: $EXISTING"
            git fetch origin "$EXISTING"
            git checkout "$EXISTING"
            echo "branch=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "is-new=false" >> "$GITHUB_OUTPUT"
          else
            BRANCH="deps/update-dependencies-$(date +%Y-%m-%d)"
            echo "No existing PR branch. Will create: $BRANCH"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "is-new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Update dependencies and sync package.json constraints
        env:
          DEPENDENCIES: ${{ inputs.dependencies }}
        run: |
          > /tmp/dependency_changes.txt

          LENGTH=$(echo "$DEPENDENCIES" | jq 'length')
          for i in $(seq 0 $((LENGTH - 1))); do
            NAME=$(echo "$DEPENDENCIES" | jq -r ".[$i].name")
            DIR=$(echo "$DEPENDENCIES" | jq -r ".[$i].directory")

            LOCK_FILE="$DIR/package-lock.json"
            BEFORE=""
            if [ -f "$LOCK_FILE" ]; then
              BEFORE=$(jq -r '.packages | to_entries[] | select(.key != "") | "\(.key | ltrimstr("node_modules/")) \(.value.version)"' "$LOCK_FILE" 2>/dev/null || echo "")
            fi

            echo "Updating $NAME..."
            cd "$DIR"
            npm update

            # Sync package.json so the manifest matches the lock file: bump each
            # directly referenced caret range to the version npm just installed.
            # Transitive dependencies are left as lock-only updates.
            for SECTION in dependencies devDependencies; do
              SPECS=$(npm pkg get "$SECTION")
              [ "$SPECS" = "{}" ] && continue
              while IFS=$'\t' read -r PKG CURRENT; do
                [ -z "$PKG" ] && continue
                # Only sync caret ranges (the constraint style used across Valkyrja manifests).
                case "$CURRENT" in
                  ^*) ;;
                  *) continue ;;
                esac
                INSTALLED=$(jq -r --arg p "$PKG" '.packages["node_modules/" + $p].version // empty' package-lock.json)
                [ -z "$INSTALLED" ] && continue
                NEW="^$INSTALLED"
                [ "$CURRENT" = "$NEW" ] && continue
                npm pkg set "$SECTION.$PKG=$NEW"
                echo "  [$SECTION] $PKG: $CURRENT -> $NEW"
              done < <(echo "$SPECS" | jq -r 'to_entries[] | "\(.key)\t\(.value)"')
            done

            cd -

            AFTER=""
            if [ -f "$LOCK_FILE" ]; then
              AFTER=$(jq -r '.packages | to_entries[] | select(.key != "") | "\(.key | ltrimstr("node_modules/")) \(.value.version)"' "$LOCK_FILE" 2>/dev/null || echo "")
            fi

            while IFS= read -r line; do
              [ -z "$line" ] && continue
              PKG=$(echo "$line" | awk '{print $1}')
              NEW_VER=$(echo "$line" | awk '{print $2}')
              OLD_VER=$(echo "$BEFORE" | grep "^$PKG " | awk '{print $2}')
              if [ -n "$OLD_VER" ] && [ "$OLD_VER" != "$NEW_VER" ]; then
                echo "$PKG|v$OLD_VER|v$NEW_VER" >> /tmp/dependency_changes.txt
              fi
            done <<< "$AFTER"
          done

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "No dependency updates found."
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Dependency updates found."
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.check-changes.outputs.has-changes == 'true'
        env:
          APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}
          BOT_USER_ID: ${{ steps.get-bot-user-id.outputs.user-id }}
        run: |
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$BOT_USER_ID+$APP_SLUG[bot]@users.noreply.github.com"

      - name: Commit and push PR branch
        if: steps.check-changes.outputs.has-changes == 'true'
        id: branch
        env:
          BRANCH: ${{ steps.prep-branch.outputs.branch }}
          IS_NEW: ${{ steps.prep-branch.outputs.is-new }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          if [ "$IS_NEW" = "true" ]; then
            git checkout -b "$BRANCH"
          fi
          git add -A
          git commit \
            --author="$ACTOR <$ACTOR_ID+$ACTOR@users.noreply.github.com>" \
            -m "[npm] Update npm dependencies."
          git push --force-with-lease origin "$BRANCH"

      - name: Create pull request
        if: steps.check-changes.outputs.has-changes == 'true' && steps.prep-branch.outputs.is-new == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BASE: ${{ github.ref_name }}
          BRANCH: ${{ steps.prep-branch.outputs.branch }}
          REVIEWER: ${{ vars.VALKYRJA_REVIEWER }}
        run: |
          BODY=""
          BODY+="# Description"$'\n'$'\n'
          BODY+="Automated npm dependency updates."$'\n'$'\n'
          BODY+="## Types of changes"$'\n'$'\n'
          BODY+="- [X] Improvement _(non-breaking change which improves code)_"$'\n'
          BODY+="- [ ] Bug fix _(non-breaking change which fixes an issue)_"$'\n'
          BODY+="- [ ] New feature _(non-breaking change which adds functionality)_"$'\n'
          BODY+="- [ ] Deprecation _(breaking change which removes functionality)_"$'\n'
          BODY+="- [ ] Breaking change _(fix or feature that would cause existing functionality to change)_"$'\n'
          BODY+="- [ ] Documentation improvement"$'\n'$'\n'
          BODY+="## Changes"$'\n'$'\n'

          if [ -s /tmp/dependency_changes.txt ]; then
            BODY+="| Package | From | To |"$'\n'
            BODY+="|---------|------|----|"$'\n'
            while IFS='|' read -r pkg from to; do
              BODY+="| \`$pkg\` | $from | $to |"$'\n'
            done < /tmp/dependency_changes.txt
          else
            BODY+="_No explicit version changes detected — lock file updates only._"$'\n'
          fi

          REVIEWER_FLAGS=""
          if [ -n "$REVIEWER" ]; then
            REVIEWER_FLAGS="--assignee $REVIEWER --reviewer $REVIEWER"
          fi

          gh pr create \
            --title "[npm] Update npm dependencies" \
            --body "$BODY" \
            --base "$BASE" \
            --head "$BRANCH" \
            $REVIEWER_FLAGS
