name: Z Reusable Java Release Plugin Portal Publish

# Publishes a Gradle plugin to the Gradle Plugin Portal.
#
# The Portal is Gradle's default plugin repository, so a consuming build resolves the plugin from a
# `plugins { id("...") }` block with no `pluginManagement` block of its own. The Portal receives the
# plugin marker and the jar.
#
# A repository that publishes a plugin calls this workflow as well as `_java-release-maven-publish`,
# not instead of it. Maven Central receives the jar alone, which a `buildscript { classpath(...) }`
# consumer and a dependency scanner resolve.
#
# The calling repository must apply the `com.gradle.plugin-publish` plugin, which is what creates
# the `publishPlugins` task.

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to use'
        type: string
        default: '21'
    secrets:
      GRADLE_PUBLISH_KEY:
        description: 'Gradle Plugin Portal API key'
        required: true
      GRADLE_PUBLISH_SECRET:
        description: 'Gradle Plugin Portal API secret'
        required: true

jobs:
  plugin-portal-publish:
    name: Publish to Gradle Plugin Portal

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Publish to Gradle Plugin Portal
        run: gradle publishPlugins --no-configuration-cache --stacktrace
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
