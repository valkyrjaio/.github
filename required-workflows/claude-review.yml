name: Claude Review

on:
  pull_request:
    types: [ opened, ready_for_review, synchronize, reopened ]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Review
    uses: valkyrjaio/.github/.github/workflows/_claude-review.yml@9ac7da1d12861fb422fe121796b764df45d4907c
    permissions:
      contents: read
      pull-requests: write
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
