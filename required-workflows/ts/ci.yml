name: CI

on:
  push:
    branches: [ 'master', '*.x' ]
  pull_request:
    # `edited` is included so a pull request that GitHub auto-retargets — which happens to a stacked
    # pull request the moment its parent merges — re-runs its checks. A base-branch change has no
    # activity type of its own; GitHub reports it as `edited` with a `changes.base` payload, and
    # `edited` is not one of the default types, so such a pull request otherwise sits with no checks
    # at all. `edited` also fires for title and description edits, so the tool jobs below additionally
    # require `changes.base` rather than replaying a whole matrix for a reworded description.
    types: [ opened, synchronize, reopened, edited ]
    branches: [ 'master', '*.x' ]

permissions:
  pull-requests: write
  contents: read

jobs:
  commit-message-check:
    name: Commit Message Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_commit-message-check.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    secrets: inherit

  trailing-newline-check:
    name: Trailing Newline Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_trailing-newline-check.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    permissions:
      pull-requests: write
      contents: read
    secrets: inherit

  typescript:
    name: TypeScript
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/.github/.github/workflows/_ts-typescript.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    with:
      ci-directory: .github/ci/typescript
      paths: |
        ci:
          - '.github/ci/typescript/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/typescript/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.ts'
          - 'tsconfig.json'
    secrets: inherit

  eslint:
    name: ESLint
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/.github/.github/workflows/_ts-eslint.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    with:
      ci-directory: .github/ci/eslint
      additional-directory: .github/ci/typescript
      paths: |
        ci:
          - '.github/ci/typescript/**'
          - '.github/ci/eslint/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/typescript/**'
          - '.github/ci/eslint/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.ts'
          - 'tests/**/*.ts'
          - 'tsconfig.json'
    secrets: inherit

  prettier:
    name: Prettier
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/.github/.github/workflows/_ts-prettier.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    with:
      ci-directory: .github/ci/prettier
      paths: |
        ci:
          - '.github/ci/prettier/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/prettier/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.ts'
          - 'tests/**/*.ts'
          - '*.json'
          - '*.md'
    secrets: inherit

  vitest:
    name: Vitest
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/.github/.github/workflows/_ts-vitest.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    with:
      ci-directory: .github/ci/vitest
      paths: |
        ci:
          - '.github/ci/vitest/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/vitest/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.ts'
          - 'tests/**/*.ts'
    secrets: inherit
