name: Cherry-pick pull-requests to Branches

on:
  workflow_dispatch:
    inputs:
      destination:
        description: 'Destination branch to cherry-pick to'
        required: true
        type: string
      hash:
        description: 'Hash to cherry-pick'
        required: true

run-name: Cherry Pick ${{ inputs.hash }} To ${{ inputs.destination }}

jobs:
  cherry-pick:
    name: Cherry-pick
    uses: valkyrjaio/.github/.github/workflows/_cherry-pick-commits.yml@d11e5129a9605bddf58695e9baaf16d28291a46c
    permissions:
      contents: write
    with:
      destination: ${{ inputs.destination }}
      hash: ${{ inputs.hash }}
      valid-branch-pattern: '^2([6-9]).x$'
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
