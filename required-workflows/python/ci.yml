name: CI

on:
  push:
    branches: [ 'master', '*.x' ]
  pull_request:
    # `edited` is included so a pull request that GitHub auto-retargets — which happens to a stacked
    # pull request the moment its parent merges — re-runs its checks. A base-branch change has no
    # activity type of its own; GitHub reports it as `edited` with a `changes.base` payload, and
    # `edited` is not one of the default types, so such a pull request otherwise sits with no checks
    # at all. `edited` also fires for title and description edits, so the tool jobs below additionally
    # require `changes.base` rather than replaying a whole matrix for a reworded description.
    types: [ opened, synchronize, reopened, edited ]
    branches: [ 'master', '*.x' ]

permissions:
  pull-requests: write
  contents: read

jobs:
  commit-message-check:
    name: Commit Message Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_commit-message-check.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    secrets: inherit

  trailing-newline-check:
    name: Trailing Newline Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_trailing-newline-check.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    permissions:
      pull-requests: write
      contents: read
    secrets: inherit

  ruff:
    name: Ruff
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/.github/.github/workflows/_python-ruff.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    with:
      ci-directory: .github/ci/ruff
      paths: |
        ci:
          - '.github/ci/ruff/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/ruff/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.py'
          - 'tests/**/*.py'
          - 'pyproject.toml'
    secrets: inherit

  mypy:
    name: mypy
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/.github/.github/workflows/_python-mypy.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    with:
      ci-directory: .github/ci/mypy
      paths: |
        ci:
          - '.github/ci/mypy/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/mypy/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.py'
          - 'tests/**/*.py'
          - 'pyproject.toml'
    secrets: inherit

  import-linter:
    name: import-linter
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/.github/.github/workflows/_python-import-linter.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    with:
      ci-directory: .github/ci/importlinter
      paths: |
        ci:
          - '.github/ci/importlinter/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/importlinter/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.py'
          - 'pyproject.toml'
    secrets: inherit

  bandit:
    name: Bandit
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/.github/.github/workflows/_python-bandit.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    with:
      ci-directory: .github/ci/bandit
      paths: |
        ci:
          - '.github/ci/bandit/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/bandit/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.py'
    secrets: inherit

  pytest:
    name: pytest
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/.github/.github/workflows/_python-pytest.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    with:
      ci-directory: .github/ci/pytest
      paths: |
        ci:
          - '.github/ci/pytest/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/pytest/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.py'
          - 'tests/**/*.py'
          - 'pyproject.toml'
    secrets: inherit
