run-name: "Rebase ${{ github.ref_name }} from master"

jobs:
  rebase:
    uses: valkyrjaio/.github/.github/workflows/_rebase-from-master.yml@fa6e8c999a5fbad492448d2097fdeb573313eef7
    permissions:
      contents: write
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
